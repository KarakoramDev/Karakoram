      additionalProperties: false
      properties:
        path:
          type: string
        before: {}
        after: {}
        sensitive:
          type: boolean
        truncated:
          type: boolean
          description: Values were replaced with byte-count markers, omitted, or the path was shortened. Missing values do not imply unset for this change.
      required:
        - path
