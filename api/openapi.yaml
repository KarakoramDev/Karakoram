        items:
          type: array
          items:
            $ref: '#/components/schemas/ElasticRole'
        nextCursor:
          type: string
    ElasticAPIKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ElasticAPIKey'
        nextCursor:
          type: string
    SystemUser:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          enum:
            - clusterAdmin
            - userAdmin
            - clusterMonitor
            - backup
            - databaseAdmin
            - karakoram
            - admin
            - karakoram-monitor
            - elastic
            - karakoram_logstash
            - karakoram_apm
            - kibana-token
            - apm-secret-token
            - postgres
            - kk_replicator
            - kk_monitor
            - kk_admin
            - kk_rewind
            - kk_proxy_admin
        username:
          type: string
        roles:
