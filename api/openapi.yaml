        label:
          type: string
        repository:
          type: string
          description: Snapshot-time repository object prefix, excluding bucket.
        prior:
          type: string
        references:
          type: array
          items:
            type: string
        walStart:
          type: string
        walStop:
          type: string
        systemId:
          type: string
          description: PostgreSQL system identifier, encoded as a string without precision loss.
        version:
          type: string
          description: PostgreSQL version recorded by pgBackRest.
        repoBytes:
          type: integer
          format: int64
        profiles:
          type: array
          readOnly: true
          uniqueItems: true
          description: Normalized snapshot-time runtime profile requirements. Physical recovery targets must select a superset; absent legacy metadata requires no profiles.
          items:
            type: string
        restorePoint:
          type: string
          readOnly: true
          description: Coordinated Citus named recovery target.
        groups:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/PostgresBackupGroup'
      required:
        - label
        - repository
        - systemId
        - version
        - repoBytes
    PostgresBackupGroup:
      type: object
      additionalProperties: false
      properties:
        group:
          type: integer
        primary:
          type: string
        timeline:
          type: integer
        backup:
          $ref: '#/components/schemas/PostgresBackup'
        lsn:
          type: string
          description: Archive fence; worker positions are conservative post-marker upper bounds.
      required: [group, backup, lsn]
    Backup:
      type: object
      additionalProperties: false
      properties:
        namespace:
          allOf:
            - $ref: '#/components/schemas/NamespaceName'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 128
        cluster:
          type: string
          pattern: ^[a-z][a-z0-9]{1,11}$
          minLength: 2
          maxLength: 12
        operationId:
          type: string
          readOnly: true
          description: Durable operation that created this backup.
        storage:
          type: string
          minLength: 1
          maxLength: 128
        provider:
          type: string
        location:
          type: string
          description: Complete snapshot-time object key, prefix, or snapshot reference.
        postgres:
          $ref: '#/components/schemas/PostgresBackup'
        type:
          type: string
          enum:
            - logical
            - physical
            - definitions
            - snapshot
            - full
            - diff
            - incr
        trigger:
          type: string
          description: What initiated the snapshot; restore identifies an automatic post-restore base backup.
          enum:
            - manual
            - schedule
            - restore
            - pitr
          # Keep existing Go constant names independent of new enum collisions.
          x-enum-varnames:
            - Manual
            - Schedule
            - BackupTriggerRestore
            - BackupTriggerPITR
        schedule:
          type: string
          minLength: 1
          maxLength: 128
        phase:
          type: string
          enum:
            - Pending
            - Running
            - Succeeded
            - Failed
            - Deleting
        pbmName:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        lastWriteTime:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
          minimum: 0
        error:
          type: string
      required:
        - namespace
        - name
        - cluster
        - storage
        - type
        - trigger
        - phase
    CreateBackupRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        storage:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          minLength: 1
          description: Must be one of the cluster provider catalog's backupTypes. Unsupported values return 400 with the provider's supported types.
      required:
        - name
        - storage
        - type
    RestoreSource:
      type: object
      additionalProperties: false
      properties:
        backup:
          type: string
          minLength: 1
          maxLength: 128
        pitrTime:
          type: string
          format: date-time
        restorePoint:
          type: string
          minLength: 1
          maxLength: 128
        sourceCluster:
          type: string
          pattern: ^[a-z][a-z0-9]{1,11}$
          minLength: 2
          maxLength: 12
      description: Set exactly one of backup, pitrTime or restorePoint; sourceCluster defaults to the target cluster. Distributed PostgreSQL accepts named restore points, not timestamps.
      oneOf:
        - required: [backup]
          not:
            anyOf:
              - required: [pitrTime]
              - required: [restorePoint]
        - required: [pitrTime]
          not:
            anyOf:
              - required: [backup]
              - required: [restorePoint]
        - required: [restorePoint]
          not:
            anyOf:
              - required: [backup]
              - required: [pitrTime]
    Restore:
