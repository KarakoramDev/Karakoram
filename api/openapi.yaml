      properties:
        id:
          type: string
        name:
          type: string
        apiKey:
          type: string
        encoded:
          type: string
        expiration:
          type: integer
          format: int64
          description: Unix milliseconds.
    ElasticAPIKey:
      type: object
      description: Only API keys created through Karakoram are visible.
      required: [id, name, creation, invalidated, username]
      properties:
        id:
          type: string
        name:
          type: string
        creation:
          type: integer
          format: int64
        expiration:
          type: integer
          format: int64
        invalidated:
          type: boolean
        username:
          type: string
    ElasticUserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ElasticUser'
        nextCursor:
