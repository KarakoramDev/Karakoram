      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        cluster:
          type: array
          items:
            type: string
        indices:
          type: array
          items:
            $ref: '#/components/schemas/ElasticIndexPrivileges'
        applications:
          type: array
          items:
            $ref: '#/components/schemas/ElasticApplicationPrivileges'
        reserved:
          type: boolean
          readOnly: true
          description: Built-in roles cannot be changed or deleted.
    ElasticRoleInput:
      type: object
      additionalProperties: false
      required: [name, cluster, indices, applications]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        cluster:
          type: array
          items:
            type: string
        indices:
          type: array
          items:
            $ref: '#/components/schemas/ElasticIndexPrivileges'
        applications:
          type: array
          items:
            $ref: '#/components/schemas/ElasticApplicationPrivileges'
    ElasticAPIKeyCreate:
      type: object
      additionalProperties: false
      required: [name, roleDescriptors]
      properties:
        name:
