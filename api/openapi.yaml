            maxLength: 12
        - name: type
          in: query
          description: Exact stored event type, normally Normal, Warning or Audit. Lifecycle details such as OperationFailed are in reason, not type.
          schema:
            type: string
            enum: [Normal, Warning, Audit]
        - name: operationId
          description: >-
            Exact operation identifier string from cluster_operations_list or operation_get;
            limits results to events associated with that operation.
          in: query
          schema:
            type: string
        - name: actor
          in: query
          description: Exact actor identity, including token name and ID when applicable.
          schema:
            type: string
        - name: resource
          in: query
          description: Exact resource category. Explicit filters without the required audit/read or events/read permission return 403; unfiltered queries silently omit unauthorized events.
          schema:
            type: string
            enum: ["", accounts, api-tokens, auth, backup-storages, backups, cluster-credentials, cluster-data, clusters, database-users, namespaces, operations, orphaned-volumes, rabbitmq-operator-policies, rabbitmq-permissions, rabbitmq-policies, rabbitmq-topic-permissions, rabbitmq-users, rabbitmq-vhosts, rbac, restores, settings, weaviate-users, weaviate-roles]
