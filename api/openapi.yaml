      summary: Evaluate an authorization tuple
      x-karakoram-rbac:
        resource: rbac
        action: read
        object: '*'
      x-karakoram-agent:
        tool: permission_check
        risk: read
        confirm: none
        async: none
        idempotent: true
      responses:
