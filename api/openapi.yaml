        '500':
          $ref: '#/components/responses/InternalError'
      description: |
        SSE frames use the durable ID as id, the stored type (normally Normal,
        Warning or Audit) verbatim as event, and a JSON Event as data. Lifecycle
        details are in reason, not dot-qualified event names. For example:

        id: 42
        event: Warning
        data: {"id":42,"cluster":"demo","type":"Warning","reason":"OperationFailed","message":"Backup failed","createdAt":"2026-01-01T00:00:00Z"}

        Replays after the requested cursor then streams live events. Heartbeat
        comments keep the connection alive. Authorization uses events:read or
        audit:read on namespace/cluster for cluster entries, audit:read on the
        namespace for namespace-level entries, and audit:read on "*" for global
        entries. Namespace, actor and resource filters compose; actor and resource
        filters are exact matches.
      parameters:
        - name: cluster
          in: query
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,11}$
            minLength: 2
            maxLength: 12
        - name: type
          in: query
          description: Exact stored event type, normally Normal, Warning or Audit. Lifecycle details such as OperationFailed are in reason, not type.
          schema:
            type: string
            enum: [Normal, Warning, Audit]
        - name: operationId
          in: query
          schema:
            type: string
        - name: actor
          in: query
          description: Exact actor identity, including token name and ID when applicable.
          schema:
            type: string
        - name: resource
          in: query
          description: Exact resource category. Explicit filters without the required audit/read or events/read permission return 403; unfiltered queries silently omit unauthorized events.
          schema:
            type: string
            enum: ["", accounts, api-tokens, auth, backup-storages, backups, cluster-credentials, clusters, database-users, namespaces, operations, orphaned-volumes, rbac, restores, settings]
        - name: cursor
          in: query
          schema:
            type: string
          description: Replay events after this durable event cursor.
        - name: Last-Event-ID
          in: header
          schema:
            type: string
          description: SSE reconnection cursor; used when cursor is absent.
  /clusters/{cluster}/metrics:
    parameters:
      - $ref: '#/components/parameters/ClusterPath'
      - $ref: '#/components/parameters/NamespaceQuery'
    get:
      operationId: getClusterMetrics
      tags:
        - Monitoring
      summary: Read aggregated per-member metric time series
      x-karakoram-rbac:
        resource: monitoring
        action: read
        object: cluster
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterMetrics'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - name: range
          in: query
          schema:
            type: string
            default: 1h
            pattern: '^[+]?(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+$'
          description: Positive Go duration no greater than 24h, for example 30m, 1h or 24h. Days are not a duration unit.
        - name: step
          in: query
          schema:
            type: string
            default: 30s
            pattern: '^[+]?(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+$'
          description: Positive Go duration no greater than range. The omitted default 30s is bounded to a shorter requested range.
  /clusters/{cluster}/members/{member}/logs:
    parameters:
      - $ref: '#/components/parameters/ClusterPath'
      - $ref: '#/components/parameters/NamespaceQuery'
      - name: member
        in: path
        schema:
          type: string
          minLength: 1
          maxLength: 128
        required: true
    get:
      operationId: getMemberLogs
      tags:
        - Monitoring
      summary: Read logs for a member process
      x-karakoram-rbac:
        resource: monitoring
        action: read
        object: cluster
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberLogs'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - name: process
          in: query
          schema:
            type: string
            enum:
              - mongod
              - mongos
              - pbm-agent
              - agent
        - name: lines
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
  /metrics:
    parameters:
      - $ref: '#/components/parameters/NamespaceQuery'
    get:
      operationId: getPrometheusMetrics
      tags:
        - Monitoring
      summary: Scrape Prometheus-compatible cluster metrics
      x-karakoram-rbac:
        resource: monitoring
        action: read
        object: '*'
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
          description: Successful response.
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
      description: Root endpoint accepts bearer API tokens (recommended for scrapers) or a signed-in browser cookie session. Both require monitoring read authorization; only authorized clusters are included.
      servers:
        - url: /
          description: Root-level control-plane endpoint, outside /api/v1.
      security:
        - bearerAuth: []
        - cookieSession: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Karakoram API token (kk_ prefix)
      description: API tokens act as their owner and do not require CSRF headers.
    cookieSession:
      type: apiKey
      in: cookie
      name: karakoram_access
      description: HttpOnly Secure SameSite=Strict EdDSA access JWT. Renew via the rotating HttpOnly karakoram_refresh cookie at /auth/refresh. X-Karakoram-CSRF is required on unsafe methods.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional retry key scoped to the authenticated account or token identity,
        method, route, namespace and path parameters. Retained for 24 hours after
        a successful response. The same key and canonical JSON body replay the
        original status, body and relevant headers, including one-time secrets
        and Karakoram-Operation-Id when present. Different bodies conflict with
        HTTP 409 (details.field Idempotency-Key, reason conflict); concurrent
        in-flight duplicates return 409 with reason invalid_state. Reservations
        use a five-minute lease renewed every minute while the handler runs;
        after a crash, an expired reservation can be reclaimed. Only successful
        2xx responses are retained for 24 hours. Lease expiry does not prove that
        the original mutation failed. Use a fresh key for each intended mutation.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[!-~]+$'
    NamespaceQuery:
      name: namespace
      in: query
      required: false
      description: Namespace of the requested object; defaults to default for single-object routes and creation. On collection routes (/clusters, /operations, /events, /events/stream, /orphaned-volumes, /backup-storages and root /metrics), absence includes all authorized namespaces and a value filters to that namespace. A nonexistent explicit namespace returns 404 not_found with resource namespace and its name only when the authenticated caller has a permission in that namespace. Otherwise collections remain empty and object requests retain their normal 403 response without revealing existence. Public and unauthenticated authentication routes do not resolve the parameter.
      schema:
        $ref: '#/components/schemas/NamespaceName'
    NamespacePath:
      name: namespace
      in: path
      required: true
      description: Project namespace name; the RBAC object is this name.
      schema:
        $ref: '#/components/schemas/NamespaceName'
    Limit:
      name: limit
      in: query
      description: Maximum results per page. Results are authorization-filtered before pagination.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the preceding page.
      schema:
        type: string
    CSRF:
      name: X-Karakoram-CSRF
      in: header
      description: Required on unsafe methods using session cookies, including refresh/logout and password changes. Must match the session CSRF token returned by login/refresh. Not required for bearer API tokens or pre-authentication login.
      schema:
        type: string
    ClusterPath:
      name: cluster
      in: path
      required: true
      description: Managed cluster name; the RBAC object is namespace/cluster.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9]{1,11}$
        minLength: 2
        maxLength: 12
  headers:
    RequestID:
      description: Correlation identifier echoed from a valid X-Request-ID request header or generated by the server.
      schema:
        type: string
    IdempotentReplayed:
      description: Present and true when the stored successful response was replayed.
      schema:
        type: boolean
        enum: [true]
  responses:
    MethodNotAllowed:
      description: 'method_not_allowed: the route exists but does not support this method.'
      headers:
        Allow:
          schema:
            type: string
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: 'payload_too_large: body exceeds the 2 MiB limit.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: 'unsupported_media_type: use a Content-Type declared for the operation.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Invalid request, query, cursor, or resource configuration.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Missing, expired or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Authenticated caller lacks permission or the CSRF check failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: The requested resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        Conflicting resource state, unsafe topology change, unsupported action,
        or unavailable replay cursor. On operations accepting Idempotency-Key,
        details.field is Idempotency-Key and details.reason is conflict for a
        different request body or invalid_state for an in-flight duplicate.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Invalid namespace token, project mismatch or duplicate project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Authentication or namespace runtime is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Unexpected server error; response does not contain secret material.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    NamespaceName:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,30}[a-z0-9]$'
      minLength: 2
      maxLength: 32
      description: Project namespace name, 2–32 lowercase letters, digits or hyphens; starts with a letter and ends with a letter or digit. The existing default namespace is reserved.
    TokenStatus:
      type: object
      additionalProperties: false
      description: Secret-safe token health; never contains a token or fingerprint.
      properties:
        source:
          type: string
          enum: [env, stored]
        valid:
          type: boolean
        lastValidatedAt:
          type: string
          format: date-time
        lastError:
          type: string
        rotatedAt:
          type: string
          format: date-time
      required: [source, valid]
    RelayStatus:
      type: object
      additionalProperties: false
      description: Relay health; the default namespace uses direct networking.
      properties:
        hostname:
          type: string
        serviceId:
          type: string
        phase:
          type: string
          enum: [NotRequired, Pending, Deploying, Ready, Error]
        connected:
          type: boolean
        connectedSince:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        version:
          type: string
        desiredVersion:
          type: string
        certNotAfter:
          type: string
          format: date-time
        reconnects:
          type: integer
          format: int64
          minimum: 0
        lastError:
          type: string
      required: [phase, connected, reconnects]
    Namespace:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/NamespaceName'
        description:
          type: string
        projectId:
          type: string
        projectName:
          type: string
        default:
          type: boolean
        phase:
          type: string
          enum: [Pending, Ready, Error, Deleting]
        token:
          $ref: '#/components/schemas/TokenStatus'
        relay:
          $ref: '#/components/schemas/RelayStatus'
        clusterCount:
          type: integer
          minimum: 0
          readOnly: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - projectId
        - projectName
        - default
        - phase
        - token
        - relay
        - clusterCount
        - createdAt
        - updatedAt
    NamespaceCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/NamespaceName'
        projectId:
          type: string
          minLength: 1
        token:
          type: string
          format: password
          minLength: 1
          writeOnly: true
        description:
          type: string
      required: [name, projectId, token]
    NamespaceUpdate:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          description: New description; an empty string clears the description.
      required: [description]
    NamespaceTokenRotate:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          format: password
          minLength: 1
          writeOnly: true
      required: [token]
    NamespaceList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Namespace'
        nextCursor:
          type: string
          description: Opaque continuation cursor; absent at the end.
      required: [items]
    Error:
      type: object
      additionalProperties: false
      description: |
        Every error response. `code` is a stable category (`invalid_request`, `unauthorized`,
        `forbidden`, `not_found`, `conflict`, `method_not_allowed`, `unsupported_media_type`,
        `payload_too_large`, `password_change_required`, `rate_limited`, `internal_error`);
        `message` is a human-readable explanation that names the rejected field or resource.
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: |
            Structured, secret-free context; omitted when there is nothing to add. Validation
            errors carry `field` (JSON path such as `spec.components.engine.replicas`, or a
            query/path parameter name) and `reason` (`required`, `unknown_field`, `invalid`,
            `out_of_range`, `unsupported`, `conflict`, `reused`). Missing or conflicting
            resources carry `resource`, `name` and `reason` (`not_found`, `already_exists`,
            `invalid_state`, `protected`) and, for `invalid_state`, the current `state`.
            Other keys may be added; clients must ignore unknown keys.
      required:
        - code
        - message
    Version:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          description: Release/source label, or "unknown (built without git metadata)" when not supplied.
        commit:
          type: string
          description: Source revision supplied at build time, or "unknown (built without git metadata)".
        buildDate:
          type: string
        apiVersion:
          type: string
        oidcEnabled:
          type: boolean
          readOnly: true
          description: Public discovery flag for the login UI; no issuer or client secret is exposed.
      required:
        - version
        - apiVersion
        - oidcEnabled
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
        database:
          type: boolean
      required:
        - status
        - database
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
      required:
        - username
        - password
    Session:
      type: object
      additionalProperties: false
      properties:
        account:
          $ref: '#/components/schemas/CurrentUser'
        csrfToken:
          type: string
          readOnly: true
        expiresAt:
          type: string
          format: date-time
      description: Sets HttpOnly Secure SameSite=Strict karakoram_access and rotating karakoram_refresh cookies. No access JWT or refresh secret is exposed in JSON.
      required:
        - account
        - csrfToken
        - expiresAt
    CurrentUser:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        subject:
          type: string
        groups:
          type: array
          items:
            type: string
        mustChangePassword:
          type: boolean
        csrfToken:
          type: string
          readOnly: true
          description: Present for cookie sessions, including OIDC sessions. Safe authenticated GET discovery allows the UI to authorize subsequent unsafe requests. Absent for bearer API-token authentication.
      required:
        - name
        - subject
        - groups
        - mustChangePassword
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 1
        newPassword:
          $ref: '#/components/schemas/AccountPassword'
      required:
        - currentPassword
        - newPassword
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          $ref: '#/components/schemas/AccountPassword'
        mustChangePassword:
          type: boolean
          default: true
      required:
        - password
    OIDCConfig:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        issuerURL:
          type: string
          format: uri
        clientId:
          type: string
        clientSecret:
          type: string
          format: password
          writeOnly: true
          minLength: 1
        scopes:
          type: array
          items:
            type: string
        groupsClaim:
          type: string
          default: groups
        redirectURL:
          type: string
          format: uri
      description: Client secret is write-only; omission on update retains the stored secret.
      required:
        - enabled
    Settings:
      type: object
      additionalProperties: false
      properties:
        oidc:
          $ref: '#/components/schemas/OIDCConfig'
      required:
        - oidc
    Permission:
      type: object
      additionalProperties: false
      properties:
        resource:
          type: string
        action:
          type: string
        object:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
      required:
        - resource
        - action
        - object
        - effect
    Permissions:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: string
        groups:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
      required:
        - subject
        - groups
        - permissions
    RBACPolicy:
      type: object
      additionalProperties: false
      properties:
        policy:
          type: string
          description: 'Casbin CSV: p, subject, resource, action, object, allow|deny; g, subject, role. Built-in roles remain installed. Validation errors name policy and the line. Replacement must preserve unrestricted administration for an enabled account or verified active OIDC group identity without denies.'
      required:
        - policy
    CanRequest:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: string
          description: Optional subject; checking another subject requires rbac read permission.
        resource:
          type: string
        action:
          type: string
          enum:
            - create
            - read
            - update
            - delete
            - export
            - '*'
        object:
          type: string
      required:
        - resource
        - action
        - object
    CanResponse:
      type: object
      additionalProperties: false
      properties:
        allowed:
          type: boolean
      required:
        - allowed
    Account:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - enabled
        - mustChangePassword
        - createdAt
        - updatedAt
    AccountName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-zA-Z][a-zA-Z0-9_.@-]{0,63}$'
      description: Start with a letter; use only letters, digits, underscore, dot, @ or dash.
    AccountPassword:
      type: string
      format: password
      writeOnly: true
      minLength: 12
      maxLength: 1024
      description: At least 12 Unicode characters and at most 1024 UTF-8 bytes. Self-service password changes must differ from the current password; rejected changes retain the mandatory-change flag. Administrative resets accept the current password, invalidate previous authentication and force a password change.
    APITokenName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '\S'
      description: Required non-blank name, trimmed before storage, 1–128 characters. Duplicate names are allowed; identify tokens by their unique ID.
    CreateAccountRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/AccountName'
        password:
          $ref: '#/components/schemas/AccountPassword'
        enabled:
          type: boolean
          default: true
        mustChangePassword:
          type: boolean
          default: true
      required:
        - name
        - password
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        mustChangePassword:
          type: boolean
      required:
        - enabled
        - mustChangePassword
    APIToken:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 128
        owner:
          type: string
          minLength: 1
          maxLength: 128
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
      description: Only metadata and a non-sensitive identifying prefix; the token value is never returned here.
      required:
        - id
        - name
        - owner
        - prefix
        - createdAt
    CreateAPITokenRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/APITokenName'
        expiresAt:
          type: string
          format: date-time
          description: Optional RFC 3339 timestamp, strictly in the future.
      required:
        - name
    UpdateAPITokenRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/APITokenName'
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339 timestamp strictly in the future, or null to remove expiry.
      required:
        - name
    CreatedAPIToken:
      type: object
      additionalProperties: false
      properties:
        token:
          $ref: '#/components/schemas/APIToken'
        secret:
          type: string
          readOnly: true
          description: kk_ prefixed bearer token, returned by creation and matching Idempotency-Key replays within 24 hours. Store securely; later GETs cannot recover it.
      required:
        - token
        - secret
    Resources:
      type: object
      additionalProperties: false
      properties:
        cpuMode:
          type: string
          enum:
            - SHARED
            - DEDICATED
        minCpu:
          type: number
          minimum: 1
        maxCpu:
          type: number
          minimum: 1
        minRam:
          type: number
          minimum: 0.5
          description: GiB
        maxRam:
          type: number
          minimum: 0.5
          description: GiB
        minDisk:
          type: number
          minimum: 5
          description: GiB
        maxDisk:
          type: number
          minimum: 5
          description: GiB
        startCpu:
          type: number
          minimum: 1
      required:
        - cpuMode
        - minCpu
        - maxCpu
        - minRam
        - maxRam
        - minDisk
        - maxDisk
    Component:
      type: object
      additionalProperties: false
      properties:
        replicas:
          type: integer
          minimum: 1
        resources:
          $ref: '#/components/schemas/Resources'
      required:
        - replicas
        - resources
    Components:
      type: object
      additionalProperties: false
      properties:
        engine:
          $ref: '#/components/schemas/Component'
        configServer:
          $ref: '#/components/schemas/Component'
        router:
          $ref: '#/components/schemas/Component'
      required:
        - engine
    Topology:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - replicaSet
            - sharded
        shards:
          type: integer
          minimum: 1
          maximum: 128
      required:
        - type
    ProviderVersion:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
        major:
          type: string
        default:
          type: boolean
        status:
          type: string
          enum:
            - supported
            - deprecated
            - unavailable
        pbmVersion:
          type: string
      required:
        - version
        - major
        - default
        - status
    UpgradePath:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
        to:
          type: string
        requiresFCV:
          type: string
        requiresBackup:
          type: boolean
          description: |
            Requires a Succeeded backup of this cluster completed within the
            last 24 hours, no earlier than cluster creation or the last known
            successful convergence to its current version. Enforced on PUT and
            PATCH version changes; missing, stale, unfinished or failed backups
            return 409 conflict with reason invalid_state. Create a backup via
            POST /api/v1/clusters/{cluster}/backups in the same namespace, wait
            for Succeeded, and retry. There is no bypass flag.
      required:
        - from
        - to
    ProviderTopology:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - replicaSet
            - sharded
        displayName:
          type: string
        defaults:
          $ref: '#/components/schemas/ClusterSpec'
        componentSchemas:
          type: object
          properties: {}
          additionalProperties: true
        limits:
          type: object
          properties: {}
          additionalProperties: true
        uiSchema:
          type: object
          properties: {}
          additionalProperties: true
      required:
        - type
        - displayName
        - defaults
        - componentSchemas
        - limits
    Preset:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
        description:
          type: string
        spec:
          $ref: '#/components/schemas/ClusterSpec'
      required:
        - name
        - displayName
        - spec
    Provider:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ProviderVersion'
        upgradePaths:
          type: array
          items:
            $ref: '#/components/schemas/UpgradePath'
        topologies:
          type: array
          items:
            $ref: '#/components/schemas/ProviderTopology'
        presets:
          type: array
          items:
            $ref: '#/components/schemas/Preset'
        backupTypes:
          type: array
          items:
            type: string
            enum:
              - logical
              - physical
      required:
        - name
        - displayName
        - versions
        - upgradePaths
        - topologies
        - presets
        - backupTypes
    BackupSchedule:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        cron:
          type: string
          description: Five-field cron expression, evaluated in UTC.
        type:
          type: string
          enum:
            - logical
            - physical
        storage:
          allOf:
            - type: string
              minLength: 1
              maxLength: 128
          description: Optional override; when omitted, use backup.storage.
        retainCount:
          type: integer
          minimum: 1
        enabled:
          type: boolean
          default: true
      required:
        - name
        - cron
        - type
        - retainCount
        - enabled
    PITRSpec:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        oplogSpanMinutes:
          type: integer
          minimum: 1
          default: 10
      required:
        - enabled
    BackupSpec:
      type: object
      additionalProperties: false
      properties:
        storage:
          type: string
          minLength: 1
          maxLength: 128
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/BackupSchedule'
        pitr:
          $ref: '#/components/schemas/PITRSpec'
    TLS:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - preferTLS
            - requireTLS
            - disabled
          default: requireTLS
        ca:
          type: string
          enum:
            - selfSigned
            - userProvided
          default: selfSigned
        certificate:
          type: string
          writeOnly: true
          description: User-provided PEM certificate chain.
        privateKey:
          type: string
          format: password
          writeOnly: true
          minLength: 1
        caCertificate:
          type: string
          writeOnly: true
        caPrivateKey:
          type: string
          format: password
          writeOnly: true
          minLength: 1
      description: PEM inputs are write-only; stored secret material is never included in cluster reads. User-provided CAs require RSA keys of at least 2048 bits or ECDSA P-256, P-384 or P-521 keys. An existing cluster's CA material cannot be replaced through PUT or PATCH (409 Conflict); coordinated CA rotation is not supported. The rotate-tls operation renews leaf certificates only.
      required:
        - mode
        - ca
    Exposure:
      type: object
      additionalProperties: false
      properties:
        public:
          type: boolean
          default: false
        ipType:
          type: string
          enum:
            - IPV6
            - IPV4
          default: IPV6
        allowlist:
          type: array
          items:
            type: string
            description: IPv4 or IPv6 CIDR.
        allowAllAddresses:
          type: boolean
          description: Explicitly acknowledge when the union of allowlist CIDRs covers every address of an IP family, including split ranges. Entries must still match ipType. Creation and changes to public, ipType or allowlist enforce these rules; unrelated updates preserve unchanged legacy exposure.
      required:
        - public
    MonitoringSpec:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: true
      required:
        - enabled
    DataSource:
      type: object
      additionalProperties: false
      properties:
        namespace:
          allOf:
            - $ref: '#/components/schemas/NamespaceName'
          description: Source namespace; defaults to the target cluster namespace.
        cluster:
          type: string
          pattern: ^[a-z][a-z0-9]{1,11}$
          minLength: 2
          maxLength: 12
        backup:
          type: string
          minLength: 1
          maxLength: 128
        pitrTime:
          type: string
          format: date-time
      description: Exactly one of backup and pitrTime is required. Seeds a new cluster from a consistent backup or point in time.
      required:
        - cluster
    ClusterSpec:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          minLength: 1
          description: Required provider identifier; list providers with GET /api/v1/providers.
        version:
          type: string
        topology:
          $ref: '#/components/schemas/Topology'
        components:
          $ref: '#/components/schemas/Components'
        engineConfig:
          type: string
          description: Validated YAML mongod/mongos overrides.
        backup:
          $ref: '#/components/schemas/BackupSpec'
        tls:
          $ref: '#/components/schemas/TLS'
        exposure:
          $ref: '#/components/schemas/Exposure'
        monitoring:
          $ref: '#/components/schemas/MonitoringSpec'
        dataSource:
          $ref: '#/components/schemas/DataSource'
      required:
        - provider
        - version
        - topology
        - components
    Condition:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        status:
          type: string
          enum:
            - 'True'
            - 'False'
            - Unknown
        reason:
          type: string
        message:
          type: string
        lastTransitionTime:
          type: string
          format: date-time
      required:
        - type
        - status
        - reason
        - message
        - lastTransitionTime
    AgentStatus:
      type: object
      additionalProperties: false
      properties:
        connected:
          type: boolean
        configVersion:
          type: integer
          format: int64
        lastSeenAt:
          type: string
          format: date-time
        version:
          type: string
      required:
        - connected
    Member:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        set:
          type: string
        role:
          type: string
          enum:
            - primary
            - secondary
            - arbiter
            - config-primary
            - config-secondary
            - router
            - unknown
        state:
          type: string
        health:
          type: boolean
        version:
          type: string
        lagSeconds:
          type: number
        optime:
          type: string
          format: date-time
        uptime:
          type: integer
          format: int64
        cpuUsage:
          type: number
        ramUsageBytes:
          type: integer
          format: int64
        diskUsageBytes:
          type: integer
          format: int64
        diskTotalBytes:
          type: integer
          format: int64
        agent:
          $ref: '#/components/schemas/AgentStatus'
        placementGroup:
          type: string
        publicHost:
          type: string
          readOnly: true
          description: Member public host:port when public exposure is enabled.
        resources:
          readOnly: true
          description: Infrastructure resources currently allocated to the member container.
          allOf:
            - $ref: '#/components/schemas/ObservedResources'
        autoscaling:
          readOnly: true
          description: Effective runtime vertical autoscaling configuration read from the platform, distinct from desired spec and current allocation. Disk bounds refer to the disposable runtime root disk, not the persistent database volume.
          allOf:
            - $ref: '#/components/schemas/Resources'
      required:
        - name
        - set
        - role
        - state
        - health
    ObservedResources:
      type: object
      additionalProperties: false
      readOnly: true
      description: Current infrastructure allocation, distinct from desired autoscaling limits.
      properties:
        cpuCores:
          type: number
          description: Allocated CPU cores.
        memoryGB:
          type: number
          description: Allocated memory in GB.
        diskGB:
          type: number
          description: Allocated disk capacity in GB.
      required:
        - cpuCores
        - memoryGB
        - diskGB
    ConnectionSummary:
      type: object
      additionalProperties: false
      properties:
        hosts:
          type: array
          items:
            type: string
        replicaSet:
          type: string
        uri:
          type: string
          description: Connection URI without a password.
        publicHosts:
          type: array
          items:
            type: string
      required:
        - hosts
        - uri
    ConnectionCredential:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          readOnly: true
          description: Revealed only with cluster-credentials read permission.
        database:
          type: string
        uri:
          type: string
          readOnly: true
          description: Credential-bearing URI; never logged or cached.
      required:
        - username
        - password
        - database
        - uri
    Connection:
      type: object
      additionalProperties: false
      properties:
        connection:
          $ref: '#/components/schemas/ConnectionSummary'
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionCredential'
        caCertificate:
          type: string
      description: 'Sensitive response. Requires cluster-credentials read separately from clusters read. Server sends Cache-Control: no-store.'
      required:
        - connection
        - credentials
    PlacementGroup:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        members:
          type: array
          items:
            type: string
      required:
        - name
        - members
    Placement:
      type: object
      additionalProperties: false
      properties:
        warning:
          type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PlacementGroup'
        guaranteedAntiAffinity:
          type: boolean
          enum:
            - false
      description: Best-effort detected co-location only. Zerops provides no host anti-affinity guarantee.
      required:
        - warning
        - groups
        - guaranteedAntiAffinity
    PITRWindow:
      type: object
      additionalProperties: false
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        available:
          type: boolean
        message:
          type: string
      description: Only a continuous PBM-verified restorable interval is reported.
      required:
        - available
    ClusterBackupStatus:
      type: object
      additionalProperties: false
      properties:
        pitrWindow:
          $ref: '#/components/schemas/PITRWindow'
        lastBackup:
          type: string
          minLength: 1
          maxLength: 128
    ClusterStatus:
      type: object
      additionalProperties: false
      properties:
        phase:
          type: string
          description: Restoring means an in-place recovery operation is executing and normal traffic may be unavailable. Suspended means runtime services are removed; member allocation is historical and agents are not connected.
          enum:
            - Creating
            - Initializing
            - Ready
            - Updating
            - Scaling
            - Upgrading
            - Restoring
            - Degraded
            - Error
            - Deleting
            - Suspended
        message:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        observedGeneration:
          type: integer
          format: int64
        version:
          type: string
          description: Observed binary version from runtime members, not the desired spec.version. Absent when no version can be observed; during a mixed-version rollout it reports the oldest observed version.
        fcv:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        connection:
          $ref: '#/components/schemas/ConnectionSummary'
        backup:
          $ref: '#/components/schemas/ClusterBackupStatus'
        placement:
          $ref: '#/components/schemas/Placement'
      required:
        - phase
        - observedGeneration
        - conditions
        - members
    Cluster:
      type: object
      additionalProperties: false
      properties:
        namespace:
          allOf:
            - $ref: '#/components/schemas/NamespaceName'
          readOnly: true
        name:
          type: string
          pattern: ^[a-z][a-z0-9]{1,11}$
          minLength: 2
          maxLength: 12
        operationId:
          type: string
          readOnly: true
          description: Tracking operation returned on create, PUT, PATCH and resume acceptance.
        generation:
          type: integer
          format: int64
        spec:
          $ref: '#/components/schemas/ClusterSpec'
        status:
          $ref: '#/components/schemas/ClusterStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - namespace
        - name
        - generation
        - spec
        - status
        - createdAt
        - updatedAt
    CreateClusterRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9]{1,11}$
          minLength: 2
          maxLength: 12
        spec:
          $ref: '#/components/schemas/ClusterInputSpec'
      required:
        - name
        - spec
    ReplaceClusterRequest:
      type: object
      additionalProperties: false
      properties:
        spec:
          $ref: '#/components/schemas/ClusterInputSpec'
        namespace:
          $ref: '#/components/schemas/NamespaceName'
        name:
          type: string
          readOnly: true
        generation:
          type: integer
          readOnly: true
        status:
          type: object
          additionalProperties: true
          readOnly: true
        createdAt:
          type: string
          readOnly: true
        updatedAt:
          type: string
          readOnly: true
      description: Replaces the full desired spec. Recognized server-owned fields from GET may be round-tripped but are ignored; PATCH rejects them.
      required:
        - spec
    ClusterMergePatch:
      x-go-type: map[string]interface{}
      type: object
      additionalProperties: false
      properties:
        spec:
          $ref: '#/components/schemas/ClusterPatchSpec'
      required: [spec]
      description: 'RFC 7396 merge patch of desired {spec: {...}}. null removes optional fields; arrays replace in full. Server-owned fields are rejected.'
    RaiseFCVRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
          description: Deployed engine major form, for example 8.0 (not 8.0.32-14). All members must finish the binary rollout before promotion.
      required:
        - version
    Balancer:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        running:
          type: boolean
          readOnly: true
        mode:
          type: string
          readOnly: true
      description: Sharded clusters only; replica-set requests fail with 409.
      required:
        - enabled
    SystemUser:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          enum:
            - clusterAdmin
            - userAdmin
            - clusterMonitor
            - backup
            - databaseAdmin
        username:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleReference'
        lastRotatedAt:
          type: string
          format: date-time
      required:
        - name
        - username
        - roles
    RoleReference:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
        db:
          type: string
      required:
        - role
        - db
    DatabaseUser:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        database:
          type: string
          minLength: 1
          maxLength: 128
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleReference'
      required:
        - username
        - database
        - roles
    CreatedDatabaseUser:
      type: object
      additionalProperties: false
      description: Application user creation result. Generated passwords are returned by creation and matching Idempotency-Key replays within 24 hours, never by subsequent reads.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        database:
          type: string
          minLength: 1
          maxLength: 128
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleReference'
        generatedPassword:
          type: string
          readOnly: true
          description: Present only when password was omitted and generated by the server. Store securely; matching Idempotency-Key retries replay it for 24 hours, but GET cannot retrieve it.
      required:
        - username
        - database
        - roles
    CreateDatabaseUserRequest:
      type: object
      additionalProperties: false
      description: Omit password to have the server generate one and return it in generatedPassword. Matching Idempotency-Key retries replay that response for 24 hours.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        database:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 8
          writeOnly: true
          description: At least eight Unicode characters accepted by MongoDB SASLprep (Unicode 3.2). Emoji, prohibited controls, unassigned characters and invalid bidirectional text are rejected. Omit to generate a password.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleReference'
      required:
        - username
        - database
        - roles
    UpdateDatabaseUserRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          allOf:
            - type: string
              minLength: 8
              writeOnly: true
              description: At least eight Unicode characters accepted by MongoDB SASLprep (Unicode 3.2). Emoji, prohibited controls, unassigned characters and invalid bidirectional text are rejected. Omit to generate a password.
          description: Omit to retain the current password; a supplied value must satisfy the same minimum and SASLprep rules as creation.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleReference'
      required:
        - roles
    PrivilegeResource:
      type: object
      additionalProperties: false
      properties:
        db:
          type: string
        collection:
          type: string
        cluster:
          type: boolean
        anyResource:
          type: boolean
      description: MongoDB privilege resource document; cluster/anyResource are mutually exclusive with db/collection.
    Privilege:
      type: object
      additionalProperties: false
      properties:
        resource:
          $ref: '#/components/schemas/PrivilegeResource'
        actions:
          type: array
          items:
            type: string
      required:
        - resource
        - actions
    DatabaseRole:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        database:
          type: string
          minLength: 1
          maxLength: 128
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleReference'
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/Privilege'
      required:
        - name
        - database
        - roles
        - privileges
    UpdateDatabaseRoleRequest:
      type: object
      additionalProperties: false
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleReference'
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/Privilege'
      required:
        - roles
        - privileges
    Backup:
      type: object
      additionalProperties: false
      properties:
        namespace:
          allOf:
            - $ref: '#/components/schemas/NamespaceName'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 128
        cluster:
          type: string
          pattern: ^[a-z][a-z0-9]{1,11}$
          minLength: 2
          maxLength: 12
        operationId:
          type: string
          readOnly: true
          description: Durable operation that created this backup.
        storage:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum:
            - logical
            - physical
        trigger:
          type: string
          enum:
            - manual
            - schedule
        schedule:
          type: string
          minLength: 1
          maxLength: 128
        phase:
          type: string
          enum:
            - Pending
            - Running
            - Succeeded
            - Failed
            - Deleting
        pbmName:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        lastWriteTime:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
          minimum: 0
        error:
          type: string
      required:
        - namespace
        - name
        - cluster
        - storage
        - type
        - trigger
        - phase
    CreateBackupRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        storage:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          minLength: 1
          description: Must be one of the cluster provider catalog's backupTypes. Unsupported values return 400 with the provider's supported types.
      required:
        - name
        - storage
        - type
    RestoreSource:
      type: object
      additionalProperties: false
      properties:
        backup:
          type: string
          minLength: 1
          maxLength: 128
        pitrTime:
          type: string
          format: date-time
        sourceCluster:
          type: string
          pattern: ^[a-z][a-z0-9]{1,11}$
          minLength: 2
          maxLength: 12
      description: Set exactly one of backup or pitrTime; sourceCluster defaults to the target cluster. Conflicting or missing selectors return 400 with field source and reason conflict.
      oneOf:
        - required: [backup]
          not:
            required: [pitrTime]
        - required: [pitrTime]
          not:
            required: [backup]
    Restore:
      type: object
      additionalProperties: false
      properties:
        namespace:
          allOf:
            - $ref: '#/components/schemas/NamespaceName'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 128
        cluster:
          type: string
          pattern: ^[a-z][a-z0-9]{1,11}$
          minLength: 2
          maxLength: 12
        operationId:
          type: string
          readOnly: true
