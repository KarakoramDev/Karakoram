    get:
      operationId: listPostgresDatabases
      tags: [Postgres]
      summary: List PostgreSQL application databases
      description: >-
        Returns an unpaginated items array containing name, owner, encoding, locale,
        allowConnections and extensions. Select a returned name for postgres_database_get;
        reserved databases are excluded.
