          content:
            text/event-stream:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
      description: 'SSE frames: id is the durable event ID, event is the event type,
        data is a JSON Event. Replays after the requested cursor then streams live
        events. Heartbeat comment frames keep the connection alive. Authorization
        filtering applies to every event cluster; non-cluster audit events require
        audit:read for "*". Actor and resource filters are exact matches.'
      parameters:
      - *id008
      - *id009
      - *id010
      - *eventActor
      - *eventResource
      - name: cursor
        in: query
        schema:
          type: string
        description: Replay events after this durable event cursor.
      - name: Last-Event-ID
        in: header
        schema:
          type: string
        description: SSE reconnection cursor; used when cursor is absent.
