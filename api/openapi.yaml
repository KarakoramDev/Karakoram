      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '200':
          description: Explicit grants, excluding reserved roles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PostgresGrant'}}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: grantPostgresPrivileges
      tags: [Postgres]
      summary: Grant whitelisted database or schema privileges
      description: >-
        Applies explicit permissions to an application identity and returns no response body.
        Inspect results with postgres_grants_list; unsupported permissions and writes to
        protected system schemas are rejected.
      x-karakoram-rbac: {resource: database-users, action: update, object: cluster}
      x-karakoram-agent:
        tool: postgres_privileges_grant
        risk: destructive
        confirm: confirm
        async: none
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: >-
          Required role and database identify entries from postgres_roles_list and
          postgres_databases_list; privileges is nonempty. Omit schema for CONNECT, CREATE, TEMP
          or TEMPORARY database permissions; supply schema for USAGE or CREATE schema
          permissions.
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostgresGrant'}
      responses:
