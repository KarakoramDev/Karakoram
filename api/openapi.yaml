          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: cluster
          description: >-
            Exact cluster-name filter from clusters_list: 2–12 lowercase letters or digits,
            beginning with a letter; combine with namespace to disambiguate names.
          in: query
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]{1,11}$
