        reserved identities are rejected.
      x-karakoram-rbac: {resource: database-users, action: update, object: cluster}
      x-karakoram-agent:
        tool: postgres_privileges_revoke
        risk: destructive
        confirm: confirm
        async: none
        idempotent: true
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        description: >-
          Required role and database identify entries from postgres_roles_list and
          postgres_databases_list; privileges is nonempty. Omit schema for CONNECT, CREATE, TEMP
          or TEMPORARY database permissions; supply schema for USAGE or CREATE schema
          permissions.
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostgresGrant'}
      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '204': {description: Privileges revoked.}
        '503': {$ref: '#/components/responses/Unavailable'}
