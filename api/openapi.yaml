        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: >-
          Required name and owner identify the new database and owning role; optional encoding
          defaults to UTF8, locale to C.UTF-8, allowConnections to true, and extensions lists
          requested extensions.
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostgresDatabase'}
      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '201':
          description: Database created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostgresDatabase'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /clusters/{cluster}/postgres/databases/{database}:
    parameters:
      - $ref: '#/components/parameters/ClusterPath'
      - $ref: '#/components/parameters/NamespaceQuery'
      - name: database
        in: path
        required: true
        description: >-
          Exact application database name, 1–63 UTF-8 bytes without control characters; use name
          from postgres_databases_list.
        schema: {type: string, minLength: 1, maxLength: 63}
    get:
      operationId: getPostgresDatabase
      tags: [Postgres]
      summary: Read a PostgreSQL application database
      description: >-
        Returns name, owner, encoding, locale, allowConnections and installed extensions for the
        selected application database. Obtain its identifier through postgres_databases_list;
        reserved identifiers are rejected.
      x-karakoram-rbac: {resource: database-users, action: read, object: cluster}
      x-karakoram-agent:
        tool: postgres_database_get
        risk: read
        confirm: none
        async: none
        idempotent: true
      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: Database attributes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostgresDatabase'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deletePostgresDatabase
      tags: [Postgres]
      summary: Delete a PostgreSQL application database
      description: >-
        Drops the entire application database selected from postgres_databases_list, including
        all schemas and their contents, and returns no response body. Reserved identifiers return
        409; force requests PostgreSQL termination of connections blocking removal.
      x-karakoram-rbac: {resource: database-users, action: delete, object: cluster}
      x-karakoram-agent:
        tool: postgres_database_delete
        risk: destructive
        confirm: name
        async: none
        idempotent: true
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - name: force
          in: query
          description: >-
            Boolean, default false; true uses PostgreSQL DROP DATABASE WITH (FORCE) to terminate
            connections that block deletion.
          schema: {type: boolean, default: false}
      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '204': {description: Database deleted.}
        '409': {$ref: '#/components/responses/Conflict'}
  /clusters/{cluster}/postgres/grants:
    parameters:
      - $ref: '#/components/parameters/ClusterPath'
