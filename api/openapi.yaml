      properties:
        grant:
          type: array
          items:
            type: string
        except:
          type: array
          items:
            type: string
    ElasticApplicationPrivileges:
      type: object
      additionalProperties: false
      required: [application, privileges, resources]
      properties:
        application:
          type: string
        privileges:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string
    ElasticRoleDescriptor:
      type: object
      additionalProperties: false
      required: [cluster, indices, applications]
      properties:
        cluster:
          type: array
          items:
            type: string
        indices:
          type: array
          items:
            $ref: '#/components/schemas/ElasticIndexPrivileges'
        applications:
          type: array
          items:
            $ref: '#/components/schemas/ElasticApplicationPrivileges'
    ElasticRole:
      type: object
