    TLSInput:
      type: object
      properties:
        mode:
          type: string
          enum:
            - preferTLS
            - requireTLS
            - disabled
          default: requireTLS
        ca:
          type: string
          enum:
            - selfSigned
            - userProvided
          default: selfSigned
        certificate:
          type: string
          writeOnly: true
          description: User-provided PEM certificate chain.
        privateKey:
          type: string
          format: password
          writeOnly: true
          minLength: 1
        caCertificate:
          type: string
          writeOnly: true
        caPrivateKey:
          type: string
          format: password
          writeOnly: true
          minLength: 1
