        confirm: confirm
        async: none
        idempotent: true
      x-karakoram-rbac-extra: {resource: clusters, action: update, object: cluster}
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: >-
          Required name identifies the role; optional login, superuser, createdb, createrole,
          replication, bypassrls, connectionLimit, memberOf, validUntil and password configure
          its attributes. Password must contain at least 12 characters, occupy no more than 1024
          UTF-8 bytes, contain no control characters and be accepted by SASLprep. The name must
          match the path; omitted attributes use replacement defaults.
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostgresRoleWrite'}
      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '200':
          description: >-
            Updated role. ProxySQL credential publication is asynchronous.
            After this response, poll GET /clusters/{cluster}/status (karactl -n NS clusters status CLUSTER -o json)
            until conditions contains type CredentialsPublished with status "True" before using changed proxy credentials.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostgresRole'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      operationId: patchPostgresRole
      tags: [Postgres]
      summary: Update selected PostgreSQL role attributes
      description: >-
        Preserves omitted attributes and returns the resulting role selected from
        postgres_roles_list. Privileged changes require clusters/update permission; poll
        cluster_status_get until CredentialsPublished is True before using changed ProxySQL
        credentials.
      x-karakoram-rbac: {resource: database-users, action: update, object: cluster}
      x-karakoram-agent:
        tool: postgres_role_update
        risk: destructive
        confirm: confirm
        async: none
      x-karakoram-rbac-extra: {resource: clusters, action: update, object: cluster}
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: >-
          Optional login, superuser, createdb, createrole, replication, bypassrls,
          connectionLimit, memberOf, validUntil and password change selected attributes;
          password must contain at least 12 characters, occupy no more than 1024 UTF-8 bytes,
          contain no control characters and be accepted by SASLprep.
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostgresRolePatch'}
      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '200':
          description: >-
            Updated role. ProxySQL credential publication is asynchronous.
            After this response, poll GET /clusters/{cluster}/status (karactl -n NS clusters status CLUSTER -o json)
            until conditions contains type CredentialsPublished with status "True" before using changed proxy credentials.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostgresRole'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deletePostgresRole
      tags: [Postgres]
      summary: Delete a PostgreSQL application role
      description: >-
        Removes the application identity selected from postgres_roles_list and returns no
        response body; reserved identities cannot be removed. ProxySQL removal is asynchronous:
        poll cluster_status_get until CredentialsPublished is True; existing sessions are not
        terminated by this barrier.
      x-karakoram-rbac: {resource: database-users, action: delete, object: cluster}
      x-karakoram-agent:
        tool: postgres_role_delete
        risk: destructive
        confirm: confirm
        async: none
        idempotent: true
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '204':
          description: >-
            Role deleted in PostgreSQL. ProxySQL removal is asynchronous.
            Poll GET /clusters/{cluster}/status (karactl -n NS clusters status CLUSTER -o json)
            until conditions contains type CredentialsPublished with status "True" for publication completion.
            Existing sessions are not terminated by this barrier.
        '409': {$ref: '#/components/responses/Conflict'}
  /clusters/{cluster}/postgres/roles/{role}/password:
    parameters:
      - $ref: '#/components/parameters/ClusterPath'
      - $ref: '#/components/parameters/NamespaceQuery'
      - name: role
        in: path
        required: true
        description: >-
          Exact application role name, 1–63 UTF-8 bytes without control characters; use name
          from postgres_roles_list.
        schema: {type: string, minLength: 1, maxLength: 63}
    post:
      operationId: rotatePostgresRolePassword
      tags: [Postgres]
      summary: Generate and rotate a login role password
      description: >-
        Returns generatedPassword after changing the login credential for an identity from
        postgres_roles_list. Privileged identities require clusters/update permission; poll
        cluster_status_get until CredentialsPublished is True before using the new ProxySQL
        credential.
      x-karakoram-rbac: {resource: database-users, action: update, object: cluster}
      x-karakoram-agent:
        tool: postgres_role_password_rotate
        risk: destructive
        confirm: confirm
        secret: true
        async: none
      x-karakoram-rbac-extra: {resource: clusters, action: update, object: cluster}
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '200':
          description: >-
            Newly generated password; never retrievable again without the same idempotency key.
            PostgreSQL and managed credential storage are updated, but ProxySQL publication is asynchronous.
            After this response, poll GET /clusters/{cluster}/status (karactl -n NS clusters status CLUSTER -o json)
            until conditions contains type CredentialsPublished with status "True" before using the new proxy password.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}, description: Never cache credentials.}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [generatedPassword]
                properties:
                  generatedPassword: {type: string}
        '503': {$ref: '#/components/responses/Unavailable'}
  /clusters/{cluster}/postgres/bindings:
