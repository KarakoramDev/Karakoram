  /metrics:
    get:
      operationId: getPrometheusMetrics
      tags:
      - Monitoring
      summary: Scrape Prometheus-compatible cluster metrics
      x-karakoram-rbac:
        resource: monitoring
        action: read
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
      description: Root endpoint requires a bearer API token and monitoring read authorization;
        cookie sessions are not accepted by scrapers. Only authorized clusters are
        included.
      servers:
      - url: /
        description: Root-level control-plane endpoint, outside /api/v1.
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Karakoram API token (kk_ prefix)
      description: API tokens act as their owner and do not require CSRF headers.
    cookieSession:
      type: apiKey
      in: cookie
      name: karakoram_access
      description: HttpOnly Secure SameSite=Strict EdDSA access JWT. Renew via the
        rotating HttpOnly karakoram_refresh cookie at /auth/refresh. X-Karakoram-CSRF
        is required on unsafe methods.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum results per page. Results are authorization-filtered before
        pagination.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the preceding page.
      schema:
        type: string
    CSRF:
      name: X-Karakoram-CSRF
      in: header
      description: Required on unsafe methods using session cookies, including refresh/logout
        and password changes. Must match the session CSRF token returned by login/refresh.
        Not required for bearer API tokens or pre-authentication login.
      schema:
        type: string
    ClusterPath:
      name: cluster
      in: path
      required: true
      description: Managed cluster name. RBAC object is this name.
      schema: *id007
  responses:
    BadRequest:
      description: Invalid request, query, cursor, or resource configuration.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, expired or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated caller lacks permission or the CSRF check failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource does not exist or is not visible to the
        caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicting resource state, unsafe topology change, unsupported
        action, or unavailable replay cursor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error; response does not contain secret material.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: Structured validation or conflict details; never contains secrets.
          nullable: true
      required:
      - code
      - message
    Version:
      type: object
      properties:
        version:
          type: string
        commit:
          type: string
        buildDate:
          type: string
        apiVersion:
          type: string
        oidcEnabled:
          type: boolean
          readOnly: true
          description: Public discovery flag for the login UI; no issuer or client secret is exposed.
      required:
      - version
      - apiVersion
      - oidcEnabled
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
        database:
          type: boolean
      required:
      - status
      - database
    LoginRequest:
      type: object
      properties:
        username: *id006
        password: &id012
          type: string
          format: password
          writeOnly: true
          minLength: 1
      required:
      - username
      - password
    Session:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/CurrentUser'
        csrfToken:
          type: string
          readOnly: true
        expiresAt: *id011
      description: Sets HttpOnly Secure SameSite=Strict karakoram_session and rotating
        karakoram_refresh cookies. No access JWT or refresh secret is exposed in JSON.
      required:
      - account
      - csrfToken
      - expiresAt
    CurrentUser:
      type: object
      properties:
        name: *id006
        subject:
          type: string
        groups:
          type: array
          items:
            type: string
        mustChangePassword:
          type: boolean
        csrfToken:
          type: string
          readOnly: true
          description: Present for cookie sessions, including OIDC sessions. Safe authenticated GET discovery allows the UI to authorize subsequent unsafe requests. Absent for bearer API-token authentication.
      required:
      - name
      - subject
      - groups
      - mustChangePassword
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword: *id012
        newPassword: *id012
      required:
      - currentPassword
      - newPassword
    ResetPasswordRequest:
      type: object
      properties:
        password: *id012
        mustChangePassword:
          type: boolean
          default: true
      required:
      - password
    OIDCConfig:
      type: object
      properties:
        enabled:
          type: boolean
        issuerURL:
          type: string
          format: uri
        clientId:
          type: string
        clientSecret: *id012
        scopes:
          type: array
          items:
            type: string
        groupsClaim:
          type: string
          default: groups
        redirectURL:
          type: string
          format: uri
      description: Client secret is write-only; omission on update retains the stored
        secret.
      required:
      - enabled
    Settings:
      type: object
      properties:
        oidc:
          $ref: '#/components/schemas/OIDCConfig'
      required:
      - oidc
    Permission:
      type: object
      properties:
        resource:
          type: string
        action:
          type: string
        object:
          type: string
        effect:
          type: string
          enum:
          - allow
          - deny
      required:
      - resource
      - action
      - object
      - effect
    Permissions:
      type: object
      properties:
        subject:
          type: string
        groups:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
      required:
      - subject
      - groups
      - permissions
    RBACPolicy:
      type: object
      properties:
        policy:
          type: string
          description: 'Casbin CSV: p, subject, resource, action, object, allow|deny;
            g, subject, role. Built-in roles remain installed.'
      required:
      - policy
    CanRequest:
      type: object
      properties:
        subject:
          type: string
          description: Optional subject; checking another subject requires rbac read
            permission.
        resource:
          type: string
        action:
          type: string
          enum:
          - create
          - read
          - update
          - delete
          - '*'
        object:
          type: string
      required:
      - resource
      - action
      - object
    CanResponse:
      type: object
      properties:
        allowed:
          type: boolean
      required:
      - allowed
    Account:
      type: object
      properties:
        name: *id006
        enabled:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt: *id011
        updatedAt: *id011
      required:
      - name
      - enabled
      - mustChangePassword
      - createdAt
      - updatedAt
    CreateAccountRequest:
      type: object
      properties:
        name: *id006
        password: *id012
        enabled:
          type: boolean
          default: true
        mustChangePassword:
          type: boolean
          default: true
      required:
      - name
      - password
    UpdateAccountRequest:
      type: object
      properties:
        enabled:
          type: boolean
        mustChangePassword:
          type: boolean
      required:
      - enabled
      - mustChangePassword
    APIToken:
      type: object
      properties:
        id: *id006
        name: *id006
        owner: *id006
        prefix:
          type: string
        createdAt: *id011
        expiresAt: *id011
        lastUsedAt: *id011
      description: Only metadata and a non-sensitive identifying prefix; the token
        value is never returned here.
      required:
      - id
      - name
      - owner
      - prefix
      - createdAt
    CreateAPITokenRequest:
      type: object
      properties:
        name: *id006
        expiresAt: *id011
      required:
      - name
    UpdateAPITokenRequest:
      type: object
      properties:
        name: *id006
