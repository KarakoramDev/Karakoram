    PostgresRoleWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 63}
        login: {type: boolean, default: true}
        superuser: {type: boolean, default: false}
        createdb: {type: boolean, default: false}
        createrole: {type: boolean, default: false}
        replication: {type: boolean, default: false}
        bypassrls: {type: boolean, default: false}
        connectionLimit: {type: integer, minimum: -1, default: -1}
        memberOf: {type: array, items: {type: string}}
        validUntil: {type: string, format: date-time}
        password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
    PostgresRolePatch:
      type: object
      additionalProperties: false
      properties:
        login: {type: boolean}
        superuser: {type: boolean}
        createdb: {type: boolean}
        createrole: {type: boolean}
        replication: {type: boolean}
        bypassrls: {type: boolean}
        connectionLimit: {type: integer, minimum: -1}
        memberOf: {type: array, items: {type: string}}
        validUntil: {type: string, format: date-time}
        password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
    PostgresRoleCreated:
      type: object
      additionalProperties: false
      required: [name, login, superuser, createdb, createrole, replication, bypassrls, connectionLimit, memberOf]
      properties:
        name: {type: string}
        login: {type: boolean}
        superuser: {type: boolean}
        createdb: {type: boolean}
        createrole: {type: boolean}
        replication: {type: boolean}
        bypassrls: {type: boolean}
        connectionLimit: {type: integer}
        memberOf: {type: array, items: {type: string}}
        validUntil: {type: string, format: date-time}
        generatedPassword: {type: string}
    PostgresDatabase:
