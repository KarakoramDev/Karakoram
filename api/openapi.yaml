        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Karakoram API token (kk_ prefix)
      description: API tokens act as their owner and do not require CSRF headers.
    cookieSession:
      type: apiKey
      in: cookie
      name: karakoram_access
      description: HttpOnly Secure SameSite=Strict EdDSA access JWT. Renew via the rotating HttpOnly karakoram_refresh cookie at /auth/refresh. X-Karakoram-CSRF is required on unsafe methods.
  parameters:
    IgnoreMaintenanceWindow:
      name: ignoreMaintenanceWindow
      in: query
      description: Explicitly bypass the cluster maintenance window for this request.
      schema: {type: boolean, default: false}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional retry key scoped to the authenticated account's name and creation
        identity (including OIDC issuer), or the specific bearer token identity,
        plus method, route, namespace and path parameters. Deleting and recreating
        an account never shares its replays. Retained for 24 hours after
        a successful response. The same key and canonical JSON body replay the
        original status, body and relevant headers, including one-time secrets
        and Karakoram-Operation-Id when present. Different bodies conflict with
        HTTP 409 (details.field Idempotency-Key, reason conflict); concurrent
        in-flight duplicates return 409 with reason invalid_state. Reservations
        use a five-minute lease renewed every minute while the handler runs;
        after a crash, an expired reservation can be reclaimed. Only successful
        2xx responses are retained for 24 hours. Lease expiry does not prove that
        the original mutation failed. Use a fresh key for each intended mutation.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[!-~]+$'
    NamespaceQuery:
      name: namespace
      in: query
      required: false
      description: Namespace of the requested object; defaults to default for single-object routes and creation. On collection routes (/clusters, /operations, /events, /events/stream, /orphaned-volumes, /backup-storages and root /metrics), absence includes all authorized namespaces and a value filters to that namespace. A nonexistent explicit namespace returns 404 not_found with resource namespace and its name only when the authenticated caller has a permission in that namespace. Otherwise collections remain empty and object requests retain their normal 403 response without revealing existence. Public and unauthenticated authentication routes do not resolve the parameter.
      schema:
        $ref: '#/components/schemas/NamespaceName'
    NamespacePath:
      name: namespace
      in: path
      required: true
      description: Project namespace name; the RBAC object is this name.
      schema:
        $ref: '#/components/schemas/NamespaceName'
    Limit:
      name: limit
      in: query
      description: Maximum results per page. Results are authorization-filtered before pagination.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the preceding page.
      schema:
        type: string
    CSRF:
      name: X-Karakoram-CSRF
      in: header
      description: Required on unsafe methods using session cookies, including refresh/logout and password changes. Must match the session CSRF token returned by login/refresh. Not required for bearer API tokens or pre-authentication login.
      schema:
        type: string
    ClusterPath:
      name: cluster
      in: path
      required: true
      description: Managed cluster name; the RBAC object is namespace/cluster.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9]{1,11}$
        minLength: 2
        maxLength: 12
  headers:
    RequestID:
      description: Correlation identifier echoed from a valid X-Request-ID request header or generated by the server.
      schema:
        type: string
    IdempotentReplayed:
      description: Present and true when the stored successful response was replayed.
      schema:
        type: boolean
        enum: [true]
  responses:
    NotImplemented:
      description: The requested feature is not implemented.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: 'method_not_allowed: the route exists but does not support this method.'
      headers:
        Allow:
          schema:
            type: string
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: 'payload_too_large: body exceeds the 2 MiB limit.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: 'unsupported_media_type: use a Content-Type declared for the operation.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Invalid request, query, cursor, or resource configuration.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Missing, expired or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Authenticated caller lacks permission or the CSRF check failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: The requested resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        Conflicting resource state, unsafe topology change, unsupported action,
        or unavailable replay cursor. On operations accepting Idempotency-Key,
        details.field is Idempotency-Key and details.reason is conflict for a
        different request body or invalid_state for an in-flight duplicate.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Invalid namespace token, project mismatch or duplicate project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Authentication, namespace runtime or database agent/relay is temporarily unavailable; retry after connectivity recovers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      description: Unexpected server error; response does not contain secret material.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    DryRunResult:
      type: object
      additionalProperties: false
      required: [operation, cluster, changes, effects, warnings]
      properties:
        operation:
          type: string
          enum: [create, replace, patch, restore]
        cluster:
          $ref: '#/components/schemas/Cluster'
        restore:
          $ref: '#/components/schemas/Restore'
        changes:
          type: array
          items:
            type: object
            required: [path]
            properties:
              path:
                type: string
              before: {}
              after: {}
        effects:
          type: array
          items:
            type: object
            required: [kind, message]
            properties:
              kind:
                type: string
                enum: [version-upgrade, member-removal, member-addition, resource-change, public-exposure, tls-downgrade, backups-disabled, in-place-restore, clone, restart-required]
              message:
                type: string
        warnings:
          type: array
          items:
            type: string
    MySQLQuorumRecoveryRequest:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [all-absent-members-fenced]
          description: Explicit acknowledgement that absent members must be fenced before quorum recovery.
    MySQLUser:
      type: object
      additionalProperties: false
      required: [name, host, maxUserConnections, locked, passwordRetained, routableThroughProxy]
      properties:
        name: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,31}$'}
        host: {type: string, enum: ['%']}
        maxUserConnections: {type: integer, minimum: 0}
        locked: {type: boolean}
        passwordRetained: {type: boolean}
        routableThroughProxy: {type: boolean}
    MySQLUserWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,31}$'}
        maxUserConnections: {type: integer, minimum: 0, default: 0}
        locked: {type: boolean, default: false}
        password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
    MySQLUserPatch:
      type: object
      additionalProperties: false
      properties:
        maxUserConnections: {type: integer, minimum: 0}
        locked: {type: boolean}
    MySQLUserCreated:
      type: object
      additionalProperties: false
      required: [name, host, maxUserConnections, locked, passwordRetained, routableThroughProxy]
      properties:
        name: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,31}$'}
        host: {type: string, enum: ['%']}
        maxUserConnections: {type: integer, minimum: 0}
        locked: {type: boolean}
        passwordRetained: {type: boolean}
        routableThroughProxy: {type: boolean}
        generatedPassword: {type: string, description: Returned only when the password was generated.}
    MySQLPasswordRotation:
      type: object
      additionalProperties: false
      required: [generatedPassword]
      properties:
        generatedPassword: {type: string}
    MySQLDatabase:
      type: object
      additionalProperties: false
      required: [name, characterSet, collation]
      properties:
        name: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$]{0,63}$'}
        characterSet: {type: string}
        collation: {type: string}
    MySQLDatabaseWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$]{0,63}$'}
        characterSet: {type: string, default: utf8mb4}
        collation: {type: string, default: utf8mb4_0900_ai_ci}
    MySQLGrant:
      type: object
      additionalProperties: false
      required: [user, database, privileges]
      properties:
        user: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,31}$'}
        database: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$]{0,63}$'}
        privileges:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/MySQLGrantPrivileges'}
    MySQLGrantPrivileges:
      type: string
      enum: [SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES, CREATE_VIEW, SHOW_VIEW, TRIGGER, EXECUTE, CREATE_ROUTINE, ALTER_ROUTINE, EVENT, LOCK_TABLES, CREATE_TEMPORARY_TABLES, ALL]
    NamespaceName:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,30}[a-z0-9]$'
      minLength: 2
      maxLength: 32
      description: Project namespace name, 2–32 lowercase letters, digits or hyphens; starts with a letter and ends with a letter or digit. The existing default namespace is reserved.
    TokenStatus:
      type: object
      additionalProperties: false
      description: Secret-safe token health; never contains a token or fingerprint.
      properties:
        source:
          type: string
          enum: [env, stored]
        valid:
          type: boolean
        lastValidatedAt:
          type: string
          format: date-time
        lastError:
          type: string
        rotatedAt:
          type: string
          format: date-time
      required: [source, valid]
    RelayStatus:
      type: object
      additionalProperties: false
      description: Relay health; the default namespace uses direct networking.
      properties:
        hostname:
          type: string
        serviceId:
          type: string
        phase:
          type: string
          enum: [NotRequired, Pending, Deploying, Ready, Error]
        connected:
          type: boolean
        connectedSince:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        version:
          type: string
        desiredVersion:
          type: string
        certNotAfter:
          type: string
          format: date-time
        reconnects:
          type: integer
          format: int64
          minimum: 0
        lastError:
          type: string
      required: [phase, connected, reconnects]
    Namespace:
      type: object
      additionalProperties: false
      properties:
        backend:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        config:
          type: object
          additionalProperties:
            type: string
        name:
          $ref: '#/components/schemas/NamespaceName'
        description:
          type: string
        projectId:
          type: string
          description: Backend target ID (Zerops project ID; Dokploy environment or Nomad namespace).
        projectName:
          type: string
        default:
          type: boolean
        phase:
          type: string
          enum: [Pending, Ready, Error, Deleting]
        token:
          $ref: '#/components/schemas/TokenStatus'
        relay:
          $ref: '#/components/schemas/RelayStatus'
        clusterCount:
          type: integer
          minimum: 0
          readOnly: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - backend
        - capabilities
        - projectId
        - projectName
        - default
        - phase
        - token
        - relay
        - clusterCount
        - createdAt
        - updatedAt
    NamespaceCreate:
      type: object
      additionalProperties: false
      properties:
        backend:
          type: string
          default: zerops
        config:
          type: object
          description: Non-secret backend settings. Zerops accepts no keys; its API URL is operator-only and cannot be overridden by a namespace.
          additionalProperties:
            type: string
        name:
          $ref: '#/components/schemas/NamespaceName'
        projectId:
          type: string
          minLength: 1
          description: Backend target ID (Zerops project ID; Dokploy environment or Nomad namespace).
        token:
          type: string
          format: password
          minLength: 1
          writeOnly: true
        description:
          type: string
      required: [name, projectId, token]
    NamespaceUpdate:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          description: New description; an empty string clears the description.
      required: [description]
    OpenBaoUnsealKeysReveal:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm: {type: string, description: Must equal the OpenBao cluster name.}
    OpenBaoUnsealKeys:
      type: object
      additionalProperties: false
      required: [sealType, recoveryShares, threshold, shares, initialRootToken, initializedAt]
      properties:
        sealType: {type: string, enum: [shamir, transit, awskms]}
        recoveryShares: {type: boolean}
        threshold: {type: integer}
        shares: {type: array, items: {type: string, format: password}}
        initialRootToken: {type: string, format: password}
        initializedAt: {type: string, format: date-time}
    OpenBaoDatabaseRoleWrite:
      type: object
      additionalProperties: false
      required: [name, access]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9-]{0,30}$'}
        access: {type: string, enum: [readonly, readwrite]}
        database: {type: string}
        defaultTtlSeconds: {type: integer, format: int64, minimum: 1, default: 3600}
        maxTtlSeconds: {type: integer, format: int64, minimum: 1, default: 86400}
    OpenBaoDatabaseRole:
      type: object
      additionalProperties: false
      required: [name, access, credentialsPath]
      properties:
        name: {type: string}
        access: {type: string, enum: [readonly, readwrite]}
        database: {type: string}
        defaultTtlSeconds: {type: integer, format: int64}
        maxTtlSeconds: {type: integer, format: int64}
        credentialsPath: {type: string}
    OpenBaoDatabaseConnectionWrite:
      type: object
      additionalProperties: false
      required: [name, targetCluster, roles]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9-]{0,30}$'}
        targetCluster: {type: string, minLength: 1}
        roles: {type: array, minItems: 1, items: {$ref: '#/components/schemas/OpenBaoDatabaseRoleWrite'}}
    OpenBaoDatabaseConnection:
      type: object
      additionalProperties: false
      required: [name, targetCluster, targetProvider, mountPath, phase, roles, createdAt]
      properties:
        name: {type: string}
        targetCluster: {type: string}
        targetProvider: {type: string}
        mountPath: {type: string}
        phase:
          type: string
          enum: [pending, ready, deleting, failed]
          x-enum-varnames: [OpenBaoConnectionPending, OpenBaoConnectionReady, OpenBaoConnectionDeleting, OpenBaoConnectionFailed]
        message: {type: string}
        roles: {type: array, items: {$ref: '#/components/schemas/OpenBaoDatabaseRole'}}
        createdAt: {type: string, format: date-time}
    OpenBaoDatabaseConnectionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/OpenBaoDatabaseConnection'}}
    TemporalClientCertificateRequest:
      type: object
      additionalProperties: false
      required: [commonName]
      properties:
        commonName: {type: string, minLength: 1, maxLength: 253}
        ttlHours: {type: integer, minimum: 1, maximum: 9528, default: 720}
    TemporalClientCertificate:
      type: object
      additionalProperties: false
      required: [serial, commonName, fingerprintSha256, issuedAt, notAfter, caFingerprintSha256, currentCa]
      properties:
        serial: {type: string}
        commonName: {type: string}
        fingerprintSha256: {type: string}
        issuedAt: {type: string, format: date-time}
        notAfter: {type: string, format: date-time}
        caFingerprintSha256: {type: string}
        currentCa:
          type: boolean
          description: Whether the issuing CA is the CA used for new client certificates now; false after a CA rotation, when the certificate no longer authenticates (old clients may still authenticate during the rolling trust overlap).
    TemporalIssuedClientCertificate:
      type: object
      additionalProperties: false
      required: [serial, commonName, fingerprintSha256, issuedAt, notAfter, caFingerprintSha256, currentCa, certificatePem, privateKeyPem, caPem, frontendAddress, serverName]
      properties:
        serial: {type: string}
        commonName: {type: string}
        fingerprintSha256: {type: string}
        issuedAt: {type: string, format: date-time}
        notAfter: {type: string, format: date-time}
        caFingerprintSha256: {type: string}
        currentCa:
          type: boolean
          description: Whether the issuing CA is the CA used for new client certificates now; false after a CA rotation, when the certificate no longer authenticates (old clients may still authenticate during the rolling trust overlap).
        certificatePem: {type: string}
        privateKeyPem: {type: string, format: password}
        caPem: {type: string}
        frontendAddress: {type: string}
        serverName: {type: string}
    TemporalClientCertificateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TemporalClientCertificate'}
    TemporalNamespace:
      type: object
      additionalProperties: false
      required: [name, retention, state, managed]
      properties:
        name: {type: string}
        retention: {type: string}
        description: {type: string}
        state: {type: string}
        managed: {type: boolean}
    TemporalNamespaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TemporalNamespace'}
    TemporalUIOIDCClientSecret:
      type: object
      additionalProperties: false
      required: [clientSecret]
      properties:
        clientSecret: {type: string, minLength: 1, format: password, writeOnly: true}
    SupabaseCredentials:
      type: object
      additionalProperties: false
      required: [apiUrl, studioUrl, anonKey, serviceRoleKey, publishableKey, secretKey, dashboardUsername, dashboardPassword, jwtSecret]
      properties:
        apiUrl: {type: string}
        studioUrl: {type: string}
        anonKey: {type: string, format: password}
        serviceRoleKey: {type: string, format: password}
        publishableKey: {type: string, format: password}
        secretKey: {type: string, format: password}
        dashboardUsername: {type: string}
        dashboardPassword: {type: string, format: password}
        jwtSecret: {type: string, format: password}
    SupabaseSMTPPassword:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, format: password, writeOnly: true}
    SupabaseFunction:
      type: object
      minProperties: 1
      description: Relative file paths mapped to source text, including a nonempty index.ts entrypoint. Total source bytes must not exceed 1 MiB; parent path components are forbidden.
      additionalProperties: {type: string}
    SupabaseFunctionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {type: string}
    NamespaceTokenRotate:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          format: password
          minLength: 1
          writeOnly: true
      required: [token]
    NamespaceList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Namespace'
        nextCursor:
          type: string
          description: Opaque continuation cursor; absent at the end.
      required: [items]
    Capability:
      type: string
      enum: [publicTcp, tcpAllowlist, publicHttps, diskGrowth, volumeQuota, placement, exec, logs, metrics, scopedTokens, dedicatedCpu, horizontalScaling, envChangeRestarts]
    BackendInfo:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        displayName:
          type: string
        experimental:
          type: boolean
        relay:
          type: boolean
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        configKeys:
          type: array
          description: Accepted namespace config keys; empty for Zerops because its API URL is operator-only.
          items:
            type: string
      required: [kind, displayName, experimental, relay, capabilities, configKeys]
    BackendList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BackendInfo'
      required: [items]
    Error:
      type: object
      additionalProperties: false
      description: |
        Every error response. `code` is a stable category (`invalid_request`, `unauthorized`,
        `forbidden`, `not_found`, `conflict`, `method_not_allowed`, `unsupported_media_type`,
        `payload_too_large`, `password_change_required`, `rate_limited`, `internal_error`);
        `message` is a human-readable explanation that names the rejected field or resource.
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: |
            Structured, secret-free context; omitted when there is nothing to add. Validation
            errors carry `field` (JSON path such as `spec.components.engine.replicas`, or a
            query/path parameter name) and `reason` (`required`, `unknown_field`, `invalid`,
            `out_of_range`, `unsupported`, `conflict`, `reused`). Missing or conflicting
            resources carry `resource`, `name` and `reason` (`not_found`, `already_exists`,
            `invalid_state`, `protected`) and, for `invalid_state`, the current `state`.
            Other keys may be added; clients must ignore unknown keys.
      required:
        - code
        - message
    Version:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          description: Release/source label, or "unknown (built without git metadata)" when not supplied.
        commit:
          type: string
          description: Source revision supplied at build time, or "unknown (built without git metadata)".
        buildDate:
          type: string
        apiVersion:
          type: string
        oidcEnabled:
          type: boolean
          readOnly: true
          description: Public discovery flag for the login UI; no issuer or client secret is exposed.
      required:
        - version
        - apiVersion
        - oidcEnabled
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
        database:
          type: boolean
      required:
        - status
        - database
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
      required:
        - username
        - password
    Session:
      type: object
      additionalProperties: false
      properties:
        account:
          $ref: '#/components/schemas/CurrentUser'
        csrfToken:
          type: string
          readOnly: true
        expiresAt:
          type: string
          format: date-time
      description: Sets HttpOnly Secure SameSite=Strict karakoram_access and rotating karakoram_refresh cookies. No access JWT or refresh secret is exposed in JSON.
      required:
        - account
        - csrfToken
        - expiresAt
    CurrentUser:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        subject:
          type: string
        groups:
          type: array
          items:
            type: string
        mustChangePassword:
          type: boolean
        csrfToken:
          type: string
          readOnly: true
          description: Present for cookie sessions, including OIDC sessions. Safe authenticated GET discovery allows the UI to authorize subsequent unsafe requests. Absent for bearer API-token authentication.
      required:
        - name
        - subject
        - groups
        - mustChangePassword
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 1
        newPassword:
          $ref: '#/components/schemas/AccountPassword'
      required:
        - currentPassword
        - newPassword
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          $ref: '#/components/schemas/AccountPassword'
        mustChangePassword:
          type: boolean
          default: true
      required:
        - password
    OIDCConfig:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        issuerURL:
          type: string
          format: uri
        clientId:
          type: string
        clientSecret:
          type: string
          format: password
          writeOnly: true
          minLength: 1
        scopes:
          type: array
          items:
            type: string
        groupsClaim:
          type: string
          default: groups
        redirectURL:
          type: string
          format: uri
      description: Client secret is write-only; omission on update retains the stored secret.
      required:
        - enabled
    Settings:
      type: object
      additionalProperties: false
      properties:
        oidc:
          $ref: '#/components/schemas/OIDCConfig'
      required:
        - oidc
    Permission:
      type: object
      additionalProperties: false
      properties:
        resource:
          type: string
        action:
          type: string
        object:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
      required:
        - resource
        - action
        - object
        - effect
    Permissions:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: string
        groups:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
      required:
        - subject
        - groups
        - permissions
    RBACPolicy:
      type: object
      additionalProperties: false
      properties:
        policy:
          type: string
          description: 'Casbin CSV: p, subject, resource, action, object, allow|deny; g, subject, role. Built-in roles remain installed. Validation errors name policy and the line. Replacement must preserve unrestricted administration for an enabled account or verified active OIDC group identity without denies.'
      required:
        - policy
    CanRequest:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: string
          description: Optional subject; checking another subject requires rbac read permission.
        resource:
          type: string
        action:
          type: string
          enum:
            - create
            - read
            - reveal
            - update
            - delete
            - export
            - '*'
        object:
          type: string
      required:
        - resource
        - action
        - object
    CanResponse:
      type: object
      additionalProperties: false
      properties:
        allowed:
          type: boolean
      required:
        - allowed
    Account:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - enabled
        - mustChangePassword
        - createdAt
        - updatedAt
    AccountName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-zA-Z][a-zA-Z0-9_.@-]{0,63}$'
      description: Start with a letter; use only letters, digits, underscore, dot, @ or dash.
    AccountPassword:
      type: string
      format: password
      writeOnly: true
      minLength: 12
      maxLength: 1024
      description: At least 12 Unicode characters and at most 1024 UTF-8 bytes. Self-service password changes must differ from the current password; rejected changes retain the mandatory-change flag. Administrative resets accept the current password, invalidate previous authentication and force a password change.
    APITokenName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '\S'
      description: Required non-blank name, trimmed before storage, 1–128 characters. Duplicate names are allowed; identify tokens by their unique ID.
    CreateAccountRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/AccountName'
        password:
          $ref: '#/components/schemas/AccountPassword'
        enabled:
          type: boolean
          default: true
        mustChangePassword:
          type: boolean
          default: true
      required:
        - name
        - password
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        mustChangePassword:
          type: boolean
      required:
        - enabled
        - mustChangePassword
    APITokenRestrictions:
      type: object
      additionalProperties: false
      description: Immutable deny overlay intersected with the owner's current permissions. Omission means unrestricted.
      properties:
        readOnly:
          type: boolean
        namespaces:
          type: array
          items:
            type: string
            pattern: '^[a-z][a-z0-9-]{0,30}[a-z0-9]$'
        clusters:
          type: array
          items:
            type: string
            pattern: '^[a-z][a-z0-9-]{0,30}[a-z0-9]/[a-z][a-z0-9]{1,11}$'
        permissions:
          type: array
          items:
            type: string
            pattern: '^[a-z][a-z-]*:([a-z][a-z-]*|\*)$'
        allowCredentialReveal:
          type: boolean
    OAuthGrant:
      type: object
      additionalProperties: false
      required: [id, owner, clientId, clientName, clientHost, scopes, namespaces, createdAt, expiresAt]
      properties:
        id:
          type: string
        owner:
          type: string
        clientId:
          type: string
        clientName:
          type: string
        clientHost:
          type: string
        scopes:
          type: array
          items:
            type: string
        namespaces:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    OAuthGrantList:
      type: object
      additionalProperties: false
      required: [enabled, items]
      properties:
        enabled:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/OAuthGrant'
    APIToken:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 128
        owner:
          type: string
          minLength: 1
          maxLength: 128
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        restrictions:
          $ref: '#/components/schemas/APITokenRestrictions'
      description: Only metadata and a non-sensitive identifying prefix; the token value is never returned here.
      required:
        - id
        - name
        - owner
        - prefix
        - createdAt
    CreateAPITokenRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/APITokenName'
        expiresAt:
          type: string
          format: date-time
          description: Optional RFC 3339 timestamp, strictly in the future.
        restrictions:
          $ref: '#/components/schemas/APITokenRestrictions'
      required:
        - name
    UpdateAPITokenRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/APITokenName'
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339 timestamp strictly in the future, or null to remove expiry.
      required:
        - name
    CreatedAPIToken:
      type: object
      additionalProperties: false
      properties:
        token:
          $ref: '#/components/schemas/APIToken'
        secret:
          type: string
          readOnly: true
          description: kk_ prefixed bearer token, returned by creation and matching Idempotency-Key replays within 24 hours. Store securely; later GETs cannot recover it.
      required:
        - token
        - secret
    Resources:
      type: object
      additionalProperties: false
      description: Resource configuration returned by the control plane. Observed member autoscaling describes runtime root disks, not persistent data volumes; request-only resource bounds do not apply.
      properties:
        cpuMode:
          type: string
          enum:
            - SHARED
            - DEDICATED
        minCpu:
          type: number
        maxCpu:
          type: number
        minRam:
          type: number
          description: GiB
        maxRam:
          type: number
          description: GiB
        minDisk:
          type: number
          description: GiB
        maxDisk:
          type: number
          description: GiB
        startCpu:
          type: number
      required:
        - cpuMode
        - minCpu
        - maxCpu
        - minRam
        - maxRam
        - minDisk
        - maxDisk
    Component:
      type: object
      additionalProperties: false
      properties:
        replicas:
          type: integer
          minimum: 0
          description: Replica count; zero disables an optional component when supported by the provider.
        resources:
          $ref: '#/components/schemas/Resources'
      required:
        - replicas
        - resources
    Components:
      type: object
      additionalProperties: false
      properties:
        engine:
          $ref: '#/components/schemas/Component'
        configServer:
          $ref: '#/components/schemas/Component'
        router:
          $ref: '#/components/schemas/Component'
        extra:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Component'
      required:
        - engine
    Topology:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - replicaSet
            - sharded
            - cluster
            - dedicatedMasters
            - single
            - ha
            - distributed
            - combined
            - split
            - group
        shards:
          type: integer
          minimum: 1
          maximum: 128
      required:
        - type
    ProviderVersion:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
        major:
          type: string
        default:
          type: boolean
        status:
          type: string
          enum:
            - supported
            - deprecated
            - unavailable
        pbmVersion:
          type: string
      required:
        - version
        - major
        - default
        - status
    UpgradePath:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
        to:
          type: string
        requiresFCV:
          type: string
        requiresBackup:
          type: boolean
          description: |
            Requires a Succeeded backup of this cluster completed within the
            last 24 hours, no earlier than cluster creation or the last known
            successful convergence to its current version. Enforced on PUT and
            PATCH version changes; missing, stale, unfinished or failed backups
            return 409 conflict with reason invalid_state. Create a backup via
            POST /api/v1/clusters/{cluster}/backups in the same namespace, wait
            for Succeeded, and retry. There is no bypass flag.
      required:
        - from
        - to
    ProviderTopology:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - replicaSet
            - sharded
            - cluster
            - dedicatedMasters
            - single
            - ha
            - distributed
            - combined
            - split
            - group
        displayName:
          type: string
        defaults:
          $ref: '#/components/schemas/ClusterSpec'
        componentSchemas:
          type: object
          properties: {}
          additionalProperties: true
        limits:
          type: object
          properties: {}
          additionalProperties: true
        uiSchema:
          type: object
          properties: {}
          additionalProperties: true
      required:
        - type
        - displayName
        - defaults
        - componentSchemas
        - limits
    Preset:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
        description:
          type: string
        spec:
          $ref: '#/components/schemas/ClusterSpec'
      required:
        - name
        - displayName
        - spec
    Provider:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ProviderVersion'
        upgradePaths:
          type: array
          items:
            $ref: '#/components/schemas/UpgradePath'
        topologies:
          type: array
          items:
            $ref: '#/components/schemas/ProviderTopology'
        presets:
          type: array
          items:
            $ref: '#/components/schemas/Preset'
        backupTypes:
          type: array
          items:
            type: string
            enum:
              - logical
              - physical
              - definitions
              - snapshot
              - raft-snapshot
              - full
              - diff
              - incr
              - incremental
              - dump
        capabilities:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            type: string
        processes:
          type: array
          items:
            type: string
        engineOptions:
          type: object
          additionalProperties: true
          description: Provider-specific engine option descriptions and constraints, such as plugin groups, dependencies, always-enabled plugins and management exposure settings.
        engineConfig:
          type: object
          additionalProperties: true
          description: Provider-specific configuration format, syntax and managed keys or prefixes that cannot be overridden. Consult the provider guide for matching semantics.
      required:
        - name
        - displayName
        - versions
        - upgradePaths
        - topologies
        - presets
        - backupTypes
    BackupSchedule:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        cron:
          type: string
          description: Five-field cron expression, evaluated in UTC.
        type:
          type: string
          enum:
            - logical
            - physical
            - definitions
            - snapshot
            - raft-snapshot
            - full
            - diff
            - incr
            - incremental
            - dump
        storage:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional override; when omitted, use backup.storage.
        retainCount:
          type: integer
          minimum: 1
        enabled:
          type: boolean
          default: true
      required:
        - name
        - cron
        - type
        - retainCount
        - enabled
    PITRSpec:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        autoReanchor:
          type: boolean
          description: MySQL and PXC only. Defaults to true when omitted. Automatically take a full backup after a stable archive-writer change; disable to manage new PITR baselines manually.
        oplogSpanMinutes:
          type: integer
          minimum: 1
          default: 10
      required:
        - enabled
    BackupSpec:
      type: object
      additionalProperties: false
      properties:
        drill:
          $ref: '#/components/schemas/BackupDrillPolicy'
        storage:
          type: string
          minLength: 1
          maxLength: 128
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/BackupSchedule'
        pitr:
          $ref: '#/components/schemas/PITRSpec'
    TLS:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - preferTLS
            - requireTLS
            - disabled
          default: requireTLS
        ca:
          type: string
          enum:
            - selfSigned
            - userProvided
          default: selfSigned
        certificate:
          type: string
          writeOnly: true
          description: User-provided PEM certificate chain.
        privateKey:
          type: string
          format: password
          writeOnly: true
          minLength: 1
        caCertificate:
          type: string
          writeOnly: true
        caPrivateKey:
          type: string
          format: password
          writeOnly: true
          minLength: 1
      description: PEM inputs are write-only; stored secret material is never included in cluster reads. User-provided CAs require RSA keys of at least 2048 bits or ECDSA P-256, P-384 or P-521 keys. An existing cluster's CA material cannot be replaced through PUT or PATCH (409 Conflict); coordinated CA rotation is not supported. The rotate-tls operation renews leaf certificates only.
      required:
        - mode
        - ca
    Exposure:
      type: object
      additionalProperties: false
      properties:
        public:
          type: boolean
          default: false
        ipType:
          type: string
          enum:
            - IPV6
            - IPV4
          default: IPV6
        allowlist:
          type: array
          items:
            type: string
            description: IPv4 or IPv6 CIDR.
        allowAllAddresses:
          type: boolean
          description: Reports full-family coverage for public exposure after a save. Private or restricted exposure clears this flag. Entries must still match ipType. Unrelated updates preserve unchanged legacy routing.
      required:
        - public
    MonitoringSpec:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: true
      required:
        - enabled
    DataSource:
      type: object
      additionalProperties: false
      properties:
        namespace:
          allOf:
            - $ref: '#/components/schemas/NamespaceName'
          description: Source namespace; defaults to the target cluster namespace.
        cluster:
          type: string
          pattern: ^[a-z][a-z0-9]{1,11}$
          minLength: 2
          maxLength: 12
        backup:
          type: string
          minLength: 1
          maxLength: 128
        pitrTime:
          type: string
          format: date-time
      description: Exactly one of backup and pitrTime is required. Seeds a new cluster from a consistent backup or point in time.
      required:
        - cluster
    DataMcpScope:
      type: object
      additionalProperties: false
      properties:
        databases:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 256
        schemas:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 256
        indexPatterns:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 256
        vhosts:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 256
    DataMcpTools:
      type: object
      additionalProperties: false
      properties:
        deny:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        confirmWrites:
          type: boolean
    DataMcpSpec:
      type: object
      additionalProperties: false
      description: Opt-in per-cluster data access. Disabled configurations retain their scope and tool settings. Writes additionally require explicit token, owner RBAC and installation grants.
      properties:
        enabled:
          type: boolean
        access:
          type: string
          enum: [read, readWrite]
        scope:
          $ref: '#/components/schemas/DataMcpScope'
        tools:
          $ref: '#/components/schemas/DataMcpTools'
        auditQueryText:
          type: boolean
          description: Include query arguments in audit records instead of only their hash.
        resources:
          $ref: '#/components/schemas/ResourcesInput'
    DataMcpScopePatch:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        databases:
          type: array
          nullable: true
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 256
        schemas:
          type: array
          nullable: true
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 256
        indexPatterns:
          type: array
          nullable: true
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 256
        vhosts:
          type: array
          nullable: true
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 256
    DataMcpToolsPatch:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        deny:
          type: array
          nullable: true
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        confirmWrites:
          type: boolean
          nullable: true
    DataMcpSpecPatch:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          nullable: true
        access:
          type: string
          enum: [read, readWrite]
          nullable: true
        scope:
          $ref: '#/components/schemas/DataMcpScopePatch'
        tools:
          $ref: '#/components/schemas/DataMcpToolsPatch'
        auditQueryText:
          type: boolean
          nullable: true
        resources:
          $ref: '#/components/schemas/ResourcesPatch'
    DataMcpStatus:
      type: object
      additionalProperties: false
      properties:
        phase:
          type: string
          enum: [Disabled, Provisioning, Ready, Degraded]
        kind:
          type: string
          enum: [companion, native]
        upstream:
          type: string
        upstreamVersion:
          type: string
        access:
          type: string
          enum: [read, readWrite]
        message:
          type: string
      required: [phase]
    ClusterSpec:
      type: object
      additionalProperties: false
      properties:
        maintenance:
          $ref: '#/components/schemas/MaintenancePolicy'
        retryEpoch:
          type: integer
          format: int64
          readOnly: true
          description: Server-managed deployment retry budget epoch. Changed only by retry-deployments, never by ordinary spec updates.
        provider:
          type: string
          minLength: 1
          description: Required provider identifier; list providers with GET /api/v1/providers.
        version:
          type: string
        topology:
          $ref: '#/components/schemas/Topology'
        components:
          $ref: '#/components/schemas/Components'
        engineConfig:
          type: string
          description: Provider-specific configuration overrides (mongod/mongos YAML for psmdb, rabbitmq.conf for rabbitmq, ...).
        engineOptions:
          type: object
          additionalProperties: true
        backup:
          $ref: '#/components/schemas/BackupSpec'
        tls:
          $ref: '#/components/schemas/TLS'
        exposure:
          $ref: '#/components/schemas/Exposure'
        monitoring:
          $ref: '#/components/schemas/MonitoringSpec'
        dataSource:
          $ref: '#/components/schemas/DataSource'
        dataMcp:
          $ref: '#/components/schemas/DataMcpSpec'
      required:
        - provider
        - version
        - topology
        - components
    Condition:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        status:
          type: string
          enum:
            - 'True'
            - 'False'
            - Unknown
        reason:
          type: string
        message:
          type: string
        lastTransitionTime:
          type: string
          format: date-time
      required:
        - type
        - status
        - reason
        - message
        - lastTransitionTime
    AgentStatus:
      type: object
      additionalProperties: false
      properties:
        connected:
          type: boolean
        configVersion:
          type: integer
          format: int64
        lastSeenAt:
          type: string
          format: date-time
        message:
          type: string
        version:
          type: string
        commit:
          type: string
        build:
          type: string
      required:
        - connected
    Member:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        group:
          type: integer
          minimum: 0
          readOnly: true
          description: Distributed PostgreSQL group; 0 is coordinator, positive groups are workers. Absent for other members.
        set:
          type: string
        role:
          type: string
          description: Provider data-member or service-component role.
          enum:
            - primary
            - secondary
            - arbiter
            - config-primary
            - config-secondary
            - router
            - broker
            - unknown
            - master
            - data
            - master,data
            - kibana
            - logstash
            - apm
            - replica
            - standalone
            - proxy
            - gateway
            - auth
            - rest
            - realtime
            - storage
            - imgproxy
            - meta
            - studio
            - functions
            - pooler
            - analytics
            - vector
        state:
          type: string
        health:
          type: boolean
        version:
          type: string
        componentVersion:
          type: string
          description: Service-component version, independent of the PostgreSQL data-member version.
        lagSeconds:
          type: number
        optime:
          type: string
          format: date-time
        uptime:
          type: integer
          format: int64
        cpuUsage:
          type: number
        ramUsageBytes:
          type: integer
          format: int64
        diskUsageBytes:
          type: integer
          format: int64
        diskTotalBytes:
          type: integer
          format: int64
        agent:
          $ref: '#/components/schemas/AgentStatus'
        placementGroup:
          type: string
        publicHost:
          type: string
          readOnly: true
          description: Member public host:port when public exposure is enabled.
        resources:
          readOnly: true
          description: CPU, memory, and root disk the member container currently has. Each value comes from the member agent's live reading of its container (cgroup CPU set and quota, cgroup memory limit, root filesystem size) when the agent is reachable and reports it; otherwise from the service's effective vertical autoscaling (start or minimum CPU, minimum RAM, minimum root disk). Absent when neither is known.
          allOf:
            - $ref: '#/components/schemas/ObservedResources'
        autoscaling:
          readOnly: true
          description: Effective runtime vertical autoscaling configuration read from the platform, distinct from desired spec and current allocation. Disk bounds refer to the disposable runtime root disk, not the persistent database volume.
          allOf:
            - $ref: '#/components/schemas/Resources'
      required:
        - name
        - set
        - role
        - state
        - health
    ObservedResources:
      type: object
      additionalProperties: false
      readOnly: true
      description: Current container allocation, distinct from desired autoscaling limits.
      properties:
        cpuCores:
          type: number
          description: Usable CPU cores.
        memoryGB:
          type: number
          description: Memory limit in GiB.
        diskGB:
          type: number
          description: Runtime root disk size in GiB, not the persistent database volume.
      required:
        - cpuCores
        - memoryGB
        - diskGB
    ConnectionSummary:
      type: object
      additionalProperties: false
      properties:
        hosts:
          type: array
          items:
            type: string
        replicaSet:
          type: string
        uri:
          type: string
          description: Connection URI without a password.
        publicHosts:
          type: array
          items:
            type: string
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
      required:
        - hosts
        - uri
    Endpoint:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        url:
          type: string
          description: Connection URL without a password.
        public:
          type: boolean
      required:
        - name
        - url
        - public
    ConnectionCredential:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          readOnly: true
          description: Revealed only with cluster-credentials read permission.
        database:
          type: string
        uri:
          type: string
          readOnly: true
          description: Credential-bearing URI; never logged or cached.
      required:
        - username
        - password
        - database
        - uri
    Connection:
      type: object
      additionalProperties: false
      properties:
        connection:
          $ref: '#/components/schemas/ConnectionSummary'
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionCredential'
        caCertificate:
          type: string
      description: 'Sensitive response. Requires cluster-credentials read separately from clusters read. Server sends Cache-Control: no-store.'
      required:
        - connection
        - credentials
    PlacementGroup:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        members:
          type: array
          items:
            type: string
      required:
        - name
        - members
    Placement:
      type: object
      additionalProperties: false
      properties:
        warning:
          type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PlacementGroup'
        guaranteedAntiAffinity:
          type: boolean
        source:
          type: string
          enum: [backend, best-effort, unavailable]
      description: Observed placement; anti-affinity is guaranteed only when supported by the backend and all authoritative placement groups are distinct.
      required:
        - warning
        - groups
        - guaranteedAntiAffinity
    PITRWindow:
      type: object
      additionalProperties: false
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        available:
          type: boolean
        message:
          type: string
        intervals:
          type: array
          description: All engine-verified restorable intervals, sorted by start, end, then backup name. Intervals anchored by different full backups are not merged. Omitted or empty when unavailable.
          items:
            $ref: '#/components/schemas/PITRInterval'
      description: Legacy start/end describe the latest-ending continuous interval; intervals lists every restorable range.
      required:
        - available
    PITRInterval:
      type: object
      additionalProperties: false
      description: A continuous engine-verified restorable interval, optionally attributed to its anchoring full backup.
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        backup:
          type: string
          description: Name of the full backup anchoring this interval; omitted when provenance is unavailable.
      required:
        - start
        - end
    ClusterBackupStatus:
      type: object
      additionalProperties: false
      properties:
        pitrWindow:
          $ref: '#/components/schemas/PITRWindow'
