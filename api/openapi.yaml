          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [CONNECT, CREATE, TEMP, TEMPORARY, USAGE]}
    RabbitMQUserWrite:
      type: object
      additionalProperties: false
      not:
        required: [password, passwordHash]
      properties:
        name:
          type: string
        tags:
          type: array
          items:
            type: string
            enum: [management, policymaker, monitoring, administrator, impersonator]
        password:
          type: string
          writeOnly: true
        passwordHash:
          type: string
          writeOnly: true
      required: [name, tags]
    CreatedRabbitMQUser:
      type: object
      additionalProperties: false
