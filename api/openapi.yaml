      - $ref: '#/components/parameters/NamespaceQuery'
      - name: backup
        in: path
        schema:
          type: string
          minLength: 1
          maxLength: 128
        required: true
    get:
      operationId: getBackup
      tags:
        - Backups
      summary: Read backup metadata and status
      description: Also reads retained backups after source cluster deletion, with the same cluster-name authorization.
      x-karakoram-rbac:
        resource: backups
        action: read
        object: cluster
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteBackup
      tags:
        - Backups
      summary: Delete PBM backup data and metadata
      description: Live clusters queue PBM deletion (202). For a deleted source cluster, the control plane deletes only this snapshot's recorded S3 directory and sibling .pbm.json metadata, then its protected recovery credential and inventory record (204). Interrupted cleanup retains a Deleting record; repeat DELETE to resume. Missing retained records return 204. Other snapshots and PITR objects are not removed.
      x-karakoram-rbac:
        resource: backups
        action: delete
        object: cluster
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '202':
          description: Accepted; track the returned operation.
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
            Karakoram-Operation-Id:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '204':
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
          description: Retained snapshot objects and record removed, or already absent.
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - $ref: '#/components/parameters/CSRF'
  /clusters/{cluster}/pitr:
    parameters:
      - $ref: '#/components/parameters/ClusterPath'
      - $ref: '#/components/parameters/NamespaceQuery'
    get:
      operationId: getPITRWindow
      tags:
        - Backups
      summary: Read the continuous restorable PITR window
      description: >-
        Returns the latest continuous backed interval; an initializing cluster with no ready replica set or no configured PBM storage returns 409 invalid_state with PITR prerequisite guidance instead of an internal error. Established coverage remains queryable during scaling, upgrades, resource changes, joins and reloads; live agent/storage failures can still affect availability. Engines without PITR return 400 invalid_request with reason unsupported and a message naming the engine capability.
      x-karakoram-rbac:
        resource: backups
