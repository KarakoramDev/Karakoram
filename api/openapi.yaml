    RabbitMQPermission:
      type: object
      additionalProperties: false
      properties:
        vhost:
          type: string
        user:
          type: string
        configure:
          type: string
        write:
          type: string
        read:
          type: string
      required: [vhost, user, configure, write, read]
    RabbitMQTopicPermission:
      type: object
      additionalProperties: false
      properties:
        vhost:
          type: string
        user:
          type: string
        exchange:
          type: string
        write:
          type: string
