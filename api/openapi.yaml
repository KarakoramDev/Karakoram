                  items: {type: array, items: {$ref: '#/components/schemas/PostgresBinding'}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /clusters/{cluster}/postgres/bindings/{binding}/rotate:
    parameters:
      - $ref: '#/components/parameters/ClusterPath'
      - $ref: '#/components/parameters/NamespaceQuery'
      - name: binding
        in: path
        required: true
