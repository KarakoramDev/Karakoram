openapi: 3.0.3
info:
  title: Karakoram API
  version: 1.0.0
  description: Self-hosted Zerops-native PSMDB and PBM orchestration. REST contracts
    for server, CLI and UI. API-token bearer authentication and HttpOnly SameSite=Strict cookie
    sessions are alternatives. Cookie-authenticated unsafe requests require X-Karakoram-CSRF.
    Secret inputs are write-only; explicit one-time token creation, generated application
    passwords returned once on user creation, and cluster-credentials reads are the only
    secret-bearing JSON responses. RBAC uses resource/action/object
    with explicit deny overriding allow; database roles share database-users authorization.
    Self-service auth/permissions endpoints require an authenticated identity but
    do not require administrative account/RBAC permissions. Global collections are
    filtered by each item’s cluster object rather than requiring a wildcard grant.
    Root /healthz and /metrics use explicit operation-level server overrides.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: /api/v1
  description: Versioned control-plane REST API.
security:
- bearerAuth: []
- cookieSession: []
tags:
- name: Auth
  description: Local and OIDC sessions; self-service identity and password operations.
- name: General
  description: Public build and health information.
- name: Settings
  description: OIDC configuration and secret-safe settings.
- name: RBAC
  description: Casbin policies, resolved permissions and authorization checks.
- name: Accounts
  description: Local account administration.
- name: APITokens
  description: Owner-scoped API tokens; token values are returned only once.
- name: Providers
  description: Engine catalogs, topology schemas, presets and upgrade paths.
- name: Clusters
  description: Desired state, observed health, credentials and sharded balancing.
- name: ClusterActions
  description: Durable disruptive cluster and system-user operations.
- name: DatabaseUsers
  description: Application database users, separate from control-plane accounts.
- name: DatabaseRoles
  description: Application role privileges and inheritance.
- name: Backups
  description: PBM inventory, backups and PITR window.
- name: Restores
  description: In-place restores; new-cluster restores use cluster dataSource.
- name: BackupStorages
  description: S3-compatible backup destinations and credential-safe verification.
- name: Operations
  description: Durable asynchronous operation tracking.
- name: Events
  description: Durable events and server-sent event replay.
- name: Monitoring
  description: JSON time series, member logs and Prometheus scraping.
paths:
  /auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Create a local-account cookie session
      x-karakoram-rbac: public
      responses:
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '404': &id004
          $ref: '#/components/responses/NotFound'
        '409': &id005
          $ref: '#/components/responses/Conflict'
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Set-Cookie:
              description: Secure HttpOnly SameSite=Strict access and rotating refresh
                cookies, emitted as separate Set-Cookie headers.
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: Revoke the current session and clear its cookies
      x-karakoram-rbac:
        resource: accounts
        action: update
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '204':
          description: Successful response.
        '500':
          $ref: '#/components/responses/InternalError'
      description: 'Self-service: authenticated subjects may revoke their own session
        regardless of administrative accounts policy.'
      parameters:
      - $ref: '#/components/parameters/CSRF'
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
      - Auth
      summary: Rotate refresh credentials and renew the session
      x-karakoram-rbac:
        resource: accounts
        action: update
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Set-Cookie:
              description: Secure HttpOnly SameSite=Strict access and rotating refresh
                cookies, emitted as separate Set-Cookie headers.
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
      description: Accepts the HttpOnly karakoram_refresh cookie even after the access
        cookie expires; rotates it atomically. Cookie requests require X-Karakoram-CSRF.
        This is a self-service account operation.
      parameters:
      - $ref: '#/components/parameters/CSRF'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
      - Auth
      summary: Read the authenticated identity
      x-karakoram-rbac:
        resource: accounts
        action: read
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '500':
          $ref: '#/components/responses/InternalError'
      description: 'Self-service: returns only the caller, independent of administrative
        accounts read policy.'
  /auth/change-password:
    post:
      operationId: changePassword
      tags:
      - Auth
      summary: Change the local caller password
      x-karakoram-rbac:
        resource: accounts
        action: update
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '204':
          description: Successful response.
        '500':
          $ref: '#/components/responses/InternalError'
      description: Self-service for local accounts; verifies currentPassword and invalidates
        existing sessions and tokens according to account policy. OIDC identities
        cannot change IdP passwords here.
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
  /auth/oidc/login:
    get:
      operationId: oidcLogin
      tags:
      - Auth
      summary: Begin OIDC authorization code login with PKCE
      x-karakoram-rbac: public
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '302':
          description: Successful response.
          headers:
            Location:
              description: Authorization endpoint with state, nonce and PKCE challenge.
              schema:
                type: string
                format: uri
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      parameters:
      - name: returnTo
        in: query
        schema:
          type: string
        description: Same-origin relative UI path after login; external URLs are rejected.
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags:
      - Auth
      summary: Exchange OIDC authorization code and establish a cookie session
      x-karakoram-rbac: public
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '302':
          description: Successful response.
          headers:
            Location:
              description: Validated same-origin post-login UI path.
              schema:
                type: string
            Set-Cookie:
              description: Session and rotating refresh cookies.
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
      description: Validates the state cookie, nonce, issuer and PKCE verifier before
        setting session cookies.
      security: []
      parameters:
      - name: code
        in: query
        schema:
          type: string
        required: true
      - name: state
        in: query
        schema:
          type: string
        required: true
  /version:
    get:
      operationId: getVersion
      tags:
      - General
      summary: Read server build and API version
      x-karakoram-rbac: public
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /healthz:
    get:
      operationId: getHealth
      tags:
      - General
      summary: Read control-plane health
      x-karakoram-rbac: public
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      servers:
      - url: /
        description: Root-level control-plane endpoint, outside /api/v1.
  /settings:
    get:
      operationId: getSettings
      tags:
      - Settings
      summary: Read OIDC configuration without client secrets
      x-karakoram-rbac:
        resource: settings
        action: read
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceSettings
      tags:
      - Settings
      summary: Replace OIDC configuration
      x-karakoram-rbac:
        resource: settings
        action: update
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
  /permissions:
    get:
      operationId: getPermissions
      tags:
      - RBAC
      summary: Resolve caller permissions and role inheritance
      x-karakoram-rbac:
        resource: rbac
        action: read
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permissions'
        '500':
          $ref: '#/components/responses/InternalError'
      description: 'Self-service: returns permissions for the current subject and
        its OIDC groups. Lists elsewhere are filtered per object.'
  /rbac/policy:
    get:
      operationId: getRBACPolicy
      tags:
      - RBAC
      summary: Read Casbin policy
      x-karakoram-rbac:
        resource: rbac
        action: read
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBACPolicy'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceRBACPolicy
      tags:
      - RBAC
      summary: Validate and atomically replace Casbin policy
      x-karakoram-rbac:
        resource: rbac
        action: update
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBACPolicy'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RBACPolicy'
  /rbac/can:
    post:
      operationId: checkPermission
      tags:
      - RBAC
      summary: Evaluate an authorization tuple
      x-karakoram-rbac:
        resource: rbac
        action: read
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanResponse'
        '500':
          $ref: '#/components/responses/InternalError'
      description: A caller can inspect its own permissions. Evaluating another subject
        requires administrative rbac read authorization.
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanRequest'
  /accounts:
    get:
      operationId: listAccounts
      tags:
      - Accounts
      summary: List local accounts
      x-karakoram-rbac:
        resource: accounts
        action: read
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createAccount
      tags:
      - Accounts
      summary: Create a local account
      x-karakoram-rbac:
        resource: accounts
        action: create
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
  /accounts/{account}:
    parameters:
    - name: account
      in: path
      schema: &id006
        type: string
        minLength: 1
        maxLength: 128
      required: true
    get:
      operationId: getAccount
      tags:
      - Accounts
      summary: Read a local account
      x-karakoram-rbac:
        resource: accounts
        action: read
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceAccount
      tags:
      - Accounts
      summary: Replace account administrative flags
      x-karakoram-rbac:
        resource: accounts
        action: update
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
    delete:
      operationId: deleteAccount
      tags:
      - Accounts
      summary: Delete an account and revoke sessions and tokens
      x-karakoram-rbac:
        resource: accounts
        action: delete
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '204':
          description: Successful response.
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/CSRF'
  /accounts/{account}/reset-password:
    parameters:
    - name: account
      in: path
      schema: *id006
      required: true
    post:
      operationId: resetAccountPassword
      tags:
      - Accounts
      summary: Reset an account password
      x-karakoram-rbac:
        resource: accounts
        action: update
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '204':
          description: Successful response.
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
  /api-tokens:
    get:
      operationId: listAPITokens
      tags:
      - APITokens
      summary: List API token metadata
      x-karakoram-rbac:
        resource: api-tokens
        action: read
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenList'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createAPIToken
      tags:
      - APITokens
      summary: Create an API token and return its secret once
      x-karakoram-rbac:
        resource: api-tokens
        action: create
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAPIToken'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPITokenRequest'
  /api-tokens/{token}:
    parameters:
    - name: token
      in: path
      schema: *id006
      required: true
    get:
      operationId: getAPIToken
      tags:
      - APITokens
      summary: Read API token metadata
      x-karakoram-rbac:
        resource: api-tokens
        action: read
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIToken'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceAPIToken
      tags:
      - APITokens
      summary: Replace API token name and expiry
      x-karakoram-rbac:
        resource: api-tokens
        action: update
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIToken'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAPITokenRequest'
    delete:
      operationId: deleteAPIToken
      tags:
      - APITokens
      summary: Revoke an API token
      x-karakoram-rbac:
        resource: api-tokens
        action: delete
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '204':
          description: Successful response.
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/CSRF'
  /providers:
    get:
      operationId: listProviders
      tags:
      - Providers
      summary: List engine providers and their catalogs
      x-karakoram-rbac:
        resource: providers
        action: read
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderList'
        '500':
          $ref: '#/components/responses/InternalError'
  /providers/{provider}:
    parameters:
    - name: provider
      in: path
      schema: *id006
      required: true
    get:
      operationId: getProvider
      tags:
      - Providers
      summary: Read versions, topologies, presets and upgrade paths
      x-karakoram-rbac:
        resource: providers
        action: read
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '500':
          $ref: '#/components/responses/InternalError'
  /clusters:
    get:
      operationId: listClusters
      tags:
      - Clusters
      summary: List readable clusters
      x-karakoram-rbac:
        resource: clusters
        action: read
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterList'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Filters each cluster by clusters read on its name; a global * check
        must not prevent scoped users from listing permitted clusters.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createCluster
      tags:
      - Clusters
      summary: Create and reconcile a cluster
      x-karakoram-rbac:
        resource: clusters
        action: create
        object: '*'
      responses:
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Also authorize clusters create against the submitted name. Returns
        desired state immediately; status tracks asynchronous reconciliation.
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClusterRequest'
  /clusters/{cluster}:
    parameters:
    - $ref: '#/components/parameters/ClusterPath'
    get:
      operationId: getCluster
      tags:
      - Clusters
      summary: Read cluster desired and observed state
