        belonging to another source cluster returns 404.
      x-karakoram-rbac: {resource: database-users, action: update, object: cluster}
      x-karakoram-rbac-extra: {resource: clusters, action: update, object: cluster}
      x-karakoram-agent:
        tool: postgres_binding_rotate
        risk: destructive
        confirm: confirm
        secret: true
        async: none
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '200':
          description: Updated binding metadata; credentials are never returned.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostgresBinding'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /clusters/{cluster}/postgres/databases:
