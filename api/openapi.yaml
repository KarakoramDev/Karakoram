openapi: 3.0.3
info:
  title: Karakoram API
  version: 1.0.0
  description: Self-hosted database orchestration across infrastructure backends and target namespaces. REST contracts for server, CLI and UI. API-token bearer authentication and HttpOnly SameSite=Strict cookie sessions are alternatives. Cookie-authenticated unsafe requests require X-Karakoram-CSRF. Secret inputs are write-only; explicit one-time token creation, generated application passwords returned once on user creation, and cluster-credentials reads are the only secret-bearing JSON responses. RBAC uses resource/action/object with explicit deny overriding allow; database roles share database-users authorization. Self-service auth/permissions endpoints require an authenticated identity but do not require administrative account/RBAC permissions. RBAC object kinds are '*' for global routes, cluster for namespace/cluster from the namespace query and cluster path, namespace for the namespace path, and storage for namespace/storage from the namespace query and storage path. Collection routes filter each item by its persisted object; create routes authorize the submitted namespaced object. Namespace creation requires namespaces/create on '*'; namespace lists filter by namespaces/read on each namespace. Namespace actions are read/create/update/delete. Root /healthz and /metrics use explicit operation-level server overrides. Every API response carries X-Request-ID for correlation. Clients may supply a 1–128-character ID using A-Z, a-z, 0-9, dot, underscore, colon or hyphen. Missing, invalid or repeated values are replaced with a generated identifier. This optional transport header is not an operation parameter; generated clients may set it through their request editor. Do not include secrets in request IDs.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /api/v1
    description: Versioned control-plane REST API.
security:
  - bearerAuth: []
  - cookieSession: []
tags:
  - name: Auth
    description: Local and OIDC sessions; self-service identity and password operations.
  - name: General
    description: Public build and health information.
  - name: Settings
    description: OIDC configuration and secret-safe settings.
  - name: RBAC
    description: Casbin policies, resolved permissions and authorization checks.
  - name: Accounts
    description: Local account administration.
  - name: APITokens
    description: Owner-scoped API tokens; token values are returned only once.
  - name: Providers
    description: Engine catalogs, topology schemas, presets and upgrade paths.
  - name: Namespaces
    description: Project namespaces, write-only tokens and relay health.
  - name: Clusters
    description: Desired state, observed health, credentials and sharded balancing.
  - name: ClusterActions
    description: Durable disruptive cluster and system-user operations.
  - name: DatabaseUsers
    description: Application database users, separate from control-plane accounts.
  - name: DatabaseRoles
    description: Application role privileges and inheritance.
  - name: Backups
    description: Engine-native backup inventory, backups and PITR window.
  - name: Restores
    description: In-place restores; new-cluster restores use cluster dataSource.
  - name: BackupStorages
    description: S3-compatible backup destinations and credential-safe verification.
  - name: Operations
    description: Durable asynchronous operation tracking.
  - name: Events
    description: Durable events and server-sent event replay.
  - name: Monitoring
    description: JSON time series, member logs and Prometheus scraping.
paths:
  /openapi.yaml:
    get:
      operationId: getOpenAPISpec
      tags:
        - General
      summary: Download this server's authoritative OpenAPI specification
      x-karakoram-rbac: public
      x-karakoram-agent:
        exposed: false
        reason: API description document.
        risk: read
        confirm: none
        async: none
        idempotent: true
      security: []
      responses:
        '200':
          description: Embedded OpenAPI YAML; publicly cacheable for five minutes.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ["public, max-age=300"]
          content:
            application/yaml:
              schema:
                type: object
                additionalProperties: true
                description: The OpenAPI document serialized as YAML.
  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Create a local-account cookie session
      description: After five failed attempts, account/source backoff starts at one second and doubles to fifteen minutes. While throttled, correct and incorrect passwords receive the same 429 response and retry delay.
      x-karakoram-rbac: public
      x-karakoram-agent:
        exposed: false
        reason: Browser-session plumbing or password input.
        risk: write
        confirm: none
        secret: true
        async: none
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Login temporarily throttled. Wait for the indicated delay before retrying.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limited
                message: Login temporarily throttled; wait before trying again
                details:
                  retryAfterSeconds: 1
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Set-Cookie:
              description: Secure HttpOnly SameSite=Strict access and rotating refresh cookies, emitted as separate Set-Cookie headers.
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Revoke the current session and clear its cookies
      x-karakoram-rbac:
        resource: accounts
        action: update
        object: '*'
      x-karakoram-agent:
        exposed: false
        reason: Browser-session plumbing or password input.
        risk: write
        confirm: none
        async: none
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '204':
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
          description: Successful response.
        '500':
          $ref: '#/components/responses/InternalError'
      description: 'Self-service: authenticated subjects may revoke their own session regardless of administrative accounts policy.'
      parameters:
        - $ref: '#/components/parameters/CSRF'
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - Auth
      summary: Rotate refresh credentials and renew the session
      x-karakoram-rbac:
        resource: accounts
        action: update
        object: '*'
      x-karakoram-agent:
        exposed: false
        reason: Browser-session plumbing or password input.
        risk: write
        confirm: none
        secret: true
        async: none
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Set-Cookie:
              description: Secure HttpOnly SameSite=Strict access and rotating refresh cookies, emitted as separate Set-Cookie headers.
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
      description: Accepts the HttpOnly karakoram_refresh cookie even after the access cookie expires; rotates it atomically. Cookie requests require X-Karakoram-CSRF. This is a self-service account operation.
      parameters:
        - $ref: '#/components/parameters/CSRF'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Auth
      summary: Read the authenticated identity
      x-karakoram-rbac:
        resource: accounts
        action: read
        object: '*'
      x-karakoram-agent:
        tool: current_user_get
        risk: read
        confirm: none
        async: none
        idempotent: true
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '500':
          $ref: '#/components/responses/InternalError'
      description: 'Self-service: returns only the caller, independent of administrative accounts read policy.'
  /auth/change-password:
    post:
      operationId: changePassword
      tags:
        - Auth
      summary: Change the local caller password
      x-karakoram-rbac:
        resource: accounts
        action: update
        object: '*'
      x-karakoram-agent:
        exposed: false
        reason: Browser-session plumbing or password input.
        risk: destructive
        confirm: confirm
        async: none
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '204':
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
          description: Successful response.
        '500':
          $ref: '#/components/responses/InternalError'
      description: Self-service for local accounts; verifies currentPassword and invalidates existing sessions and tokens according to account policy. OIDC identities cannot change IdP passwords here.
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
  /auth/oidc/login:
    get:
      operationId: oidcLogin
      tags:
        - Auth
      summary: Begin OIDC authorization code login with PKCE
      x-karakoram-rbac: public
      x-karakoram-agent:
        exposed: false
        reason: Browser-session plumbing or password input.
        risk: read
        confirm: none
        async: none
        idempotent: true
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '302':
          description: Successful response.
          headers:
            Location:
              description: Authorization endpoint with state, nonce and PKCE challenge.
              schema:
                type: string
                format: uri
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      parameters:
        - name: returnTo
          in: query
          schema:
            type: string
          description: Accepted UI return-path hint; currently ignored. Successful OIDC authentication redirects to the installation root.
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags:
        - Auth
      summary: Exchange OIDC authorization code and establish a cookie session
      x-karakoram-rbac: public
      x-karakoram-agent:
        exposed: false
        reason: Browser-session plumbing or password input.
        risk: read
        confirm: none
        async: none
        idempotent: true
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '302':
          description: Successful response.
          headers:
            Location:
              description: Installation root after successful authentication.
              schema:
                type: string
            Set-Cookie:
              description: Session and rotating refresh cookies.
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Validates the state cookie, nonce, issuer and PKCE verifier before setting session cookies.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
          required: true
        - name: state
          in: query
          schema:
            type: string
          required: true
  /version:
    get:
      operationId: getVersion
      tags:
        - General
      summary: Read server build and API version
      x-karakoram-rbac: public
      x-karakoram-agent:
        tool: version_get
        risk: read
        confirm: none
        async: none
        idempotent: true
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /healthz:
    get:
      operationId: getHealth
      tags:
        - General
      summary: Read control-plane health
      x-karakoram-rbac: public
      x-karakoram-agent:
        tool: health_get
        risk: read
        confirm: none
        async: none
        idempotent: true
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      servers:
        - url: /
          description: Root-level control-plane endpoint, outside /api/v1.
  /settings:
    get:
      operationId: getSettings
      tags:
        - Settings
      summary: Read OIDC configuration without client secrets
      x-karakoram-rbac:
        resource: settings
        action: read
        object: '*'
      x-karakoram-agent:
        tool: settings_get
        risk: read
        confirm: none
        async: none
        idempotent: true
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceSettings
      tags:
        - Settings
      summary: Replace OIDC configuration
      x-karakoram-rbac:
        resource: settings
        action: update
        object: '*'
      x-karakoram-agent:
        tool: settings_replace
        risk: destructive
        confirm: confirm
        async: none
        idempotent: true
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
  /permissions:
    get:
      operationId: getPermissions
      tags:
        - RBAC
      summary: Resolve caller permissions and role inheritance
      x-karakoram-rbac:
        resource: rbac
        action: read
        object: '*'
      x-karakoram-agent:
        tool: permissions_get
        risk: read
        confirm: none
        async: none
        idempotent: true
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permissions'
        '500':
          $ref: '#/components/responses/InternalError'
      description: 'Self-service: returns permissions for the current subject and its OIDC groups. Lists elsewhere are filtered per object.'
  /rbac/policy:
    get:
      operationId: getRBACPolicy
      tags:
        - RBAC
      summary: Read Casbin policy
      x-karakoram-rbac:
        resource: rbac
        action: read
        object: '*'
      x-karakoram-agent:
        tool: rbac_policy_get
        risk: read
        confirm: none
