listeners.tcp.default = 5672
listeners.ssl.default = 5671
ssl_options.cacertfile = /data/karakoram/tls/ca.pem
management.ssl.cacertfile = /data/karakoram/tls/ca.pem
ssl_options.certfile = /data/karakoram/tls/server.pem
management.ssl.certfile = /data/karakoram/tls/server.pem
ssl_options.keyfile = /data/karakoram/tls/server.key
management.ssl.keyfile = /data/karakoram/tls/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
management.tcp.port = 15672
management.ssl.port = 15671
prometheus.tcp.port = 15692
prometheus.tcp.ip = 127.0.0.1
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rmqone
cluster_formation.discovery_retry_limit = 30
cluster_formation.discovery_retry_interval = 1000
log.console = true
log.file = false
vm_memory_high_watermark.absolute = 536870912
total_memory_available_override_value = 1073741824
disk_free_limit.absolute = 1073741824
default_queue_type = quorum
quorum_queue.initial_cluster_size = 1

# Customer overrides
heartbeat = 42
